<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Promptly · Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="assets/promptly-mark-white.png" />
    <link rel="stylesheet" href="styles.css?t=1771556488" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="/css/sidebar.css" />
    <link rel="stylesheet" href="/css/mobile.css" />
    <style>
      body.auth-pending { visibility: hidden; }
    </style>
    <script src="assets/vendor/supabase.js"></script>
  </head>
  <body class="page-account auth-pending">

    <!-- ═══ Mobile Account View ═══ -->
    <div id="mobile-account-page" class="mobile-page">
      <header class="mobile-header">
        <span class="mobile-header-title">Account</span>
      </header>
      <div class="mobile-account" id="mobile-account"></div>
    </div>

    <script type="module">
    import { supabase } from './supabase-client.js';

    window.supabaseClient = window.supabaseClient || supabase;

    (async function initAccountPage() {
      const page = document.getElementById('mobile-account-page');
      const container = document.getElementById('mobile-account');
      if (!page || !container) return;

      // Check auth
      const { data: { user }, error: authErr } = await supabase.auth.getUser();
      if (authErr || !user) {
        window.location.href = '/auth.html';
        return;
      }

      document.body.classList.remove('auth-pending');
      page.classList.add('active');

      const meta = user.user_metadata || {};
      const fullName = meta.full_name || meta.name || '';
      const email = user.email || '';
      const initial = (fullName || email || 'U').charAt(0).toUpperCase();
      const avatarUrl = meta.avatar_url || '';

      // Fetch tier
      let tier = 'free';
      try {
        const { data: profile } = await supabase
          .from('profiles')
          .select('tier')
          .eq('id', user.id)
          .single();
        if (profile?.tier) tier = String(profile.tier).toLowerCase();
      } catch (_) {}

      const isPro = tier === 'pro';

      const avatarInner = avatarUrl
        ? `<img src="${avatarUrl}" alt="" />`
        : `<span class="mobile-account-avatar-letter">${initial}</span>`;

      const chevron = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';

      container.innerHTML = `
        <div class="mobile-account-avatar">
          <div class="mobile-account-avatar-ring" id="avatar-ring">${avatarInner}</div>
          <div class="mobile-account-name" id="display-name">${escapeHtml(fullName || 'User')}</div>
          <div class="mobile-account-email">${escapeHtml(email)}</div>
        </div>

        <div class="mobile-account-section">
          <div class="mobile-account-section-title">Profile</div>
          <button class="mobile-account-row" id="edit-name-row">
            <span class="mobile-account-row-label">Name</span>
            <span class="mobile-account-row-value"><span id="name-value">${escapeHtml(fullName || 'Not set')}</span> ${chevron}</span>
          </button>
          <button class="mobile-account-row" id="edit-email-row">
            <span class="mobile-account-row-label">Email</span>
            <span class="mobile-account-row-value">${escapeHtml(email)} ${chevron}</span>
          </button>
        </div>

        <div class="mobile-account-section">
          <div class="mobile-account-section-title">Subscription</div>
          <button class="mobile-account-row" id="plan-row">
            <span class="mobile-account-row-label">Plan</span>
            <span class="mobile-account-row-value">
              <span class="mobile-account-plan-badge ${isPro ? 'pro' : 'free'}">${isPro ? 'Pro' : 'Free'}</span>
              ${chevron}
            </span>
          </button>
        </div>

        <div class="mobile-account-section">
          <div class="mobile-account-section-title">Support</div>
          <button class="mobile-account-row" onclick="window.location.href='/help.html'">
            <span class="mobile-account-row-label">Help & Support</span>
            <span class="mobile-account-row-value">${chevron}</span>
          </button>
          <button class="mobile-account-row" onclick="window.location.href='/reset-password.html'">
            <span class="mobile-account-row-label">Change Password</span>
            <span class="mobile-account-row-value">${chevron}</span>
          </button>
        </div>

        <button class="mobile-account-signout" id="signout-btn">Sign Out</button>
        <div class="mobile-account-version">Promptly v1.0</div>
      `;

      // ── Edit name ──
      document.getElementById('edit-name-row').addEventListener('click', async () => {
        const newName = prompt('Enter your name', fullName);
        if (!newName || newName.length > 32 || newName === fullName) return;
        try {
          const { error } = await supabase.auth.updateUser({ data: { full_name: newName } });
          if (error) throw error;
          document.getElementById('display-name').textContent = newName;
          document.getElementById('name-value').textContent = newName;
          const ring = document.getElementById('avatar-ring');
          if (!avatarUrl && ring) {
            ring.innerHTML = `<span class="mobile-account-avatar-letter">${newName.charAt(0).toUpperCase()}</span>`;
          }
        } catch (e) {
          alert('Failed to update name.');
        }
      });

      // ── Plan / billing ──
      document.getElementById('plan-row').addEventListener('click', async () => {
        if (isPro) {
          try {
            const session = await supabase.auth.getSession();
            const token = session?.data?.session?.access_token;
            const res = await fetch('/api/billing/portal', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
            });
            const data = await res.json();
            if (data?.url) window.location.href = data.url;
          } catch (_) {
            alert('Could not open billing portal.');
          }
        } else {
          window.location.href = '/#pricing';
        }
      });

      // ── Sign out ──
      document.getElementById('signout-btn').addEventListener('click', async () => {
        await supabase.auth.signOut();
        localStorage.removeItem('promptly_current_user');
        window.location.href = '/auth.html';
      });

      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str || '';
        return div.innerHTML;
      }
    })();
    </script>

    <script src="/components/mobile-nav.js"></script>
  </body>
</html>
