<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Video Editor | Promptly</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface-2: #1a1a1a;
      --text: #ffffff;
      --muted: #808080;
      --muted-2: #606060;
      --border: #1a1a1a;
      --border-2: #404040;
      --border-3: #606060;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }

    .page-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top-nav {
      background: #0a0a0a;
      border-bottom: 1px solid #1a1a1a;
      padding: 16px 24px;
    }

    .top-nav__inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .hamburger-btn {
      appearance: none;
      border: none;
      background: transparent;
      padding: 4px;
      margin: 0;
      cursor: pointer;
      display: inline-flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
    }

    .hamburger-btn__line {
      width: 24px;
      height: 2px;
      background: #ffffff;
      border-radius: 2px;
      display: block;
    }

    .profile-wrap {
      position: relative;
    }

    .profile-trigger {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 2px solid #2a2a2a;
      background: #1a1a1a;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: border-color 0.2s ease;
    }

    .profile-trigger:hover {
      border-color: #404040;
    }

    .profile-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      min-width: 180px;
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 8px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
      z-index: 60;
    }

    .profile-menu button {
      width: 100%;
      text-align: left;
      appearance: none;
      border: none;
      background: transparent;
      color: #ddd;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .profile-menu button:hover {
      background: #202020;
      color: #fff;
    }

    .sidebar-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 65;
    }

    .side-drawer {
      position: fixed;
      top: 0;
      left: 0;
      width: 260px;
      height: 100vh;
      background: #111;
      border-right: 1px solid #222;
      padding: 20px;
      z-index: 70;
      transform: translateX(-100%);
      transition: transform 0.2s ease;
    }

    .side-drawer.is-open {
      transform: translateX(0);
    }

    .side-drawer__title {
      margin: 0 0 20px;
      font-size: 14px;
      color: #808080;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .side-drawer__link {
      display: block;
      text-decoration: none;
      color: #fff;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .side-drawer__link:hover {
      border-color: #303030;
      background: #181818;
    }

    .side-drawer__link.is-active {
      background: #1f1f1f;
      border-color: #343434;
    }

    .content {
      flex: 1;
      padding: 40px 24px;
    }

    .content-inner {
      max-width: 800px;
      margin: 0 auto;
    }

    .header-block {
      margin-bottom: 40px;
      text-align: center;
    }

    .header-title {
      margin: 0 0 10px;
      font-size: 42px;
      line-height: 1.1;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .header-subtitle {
      margin: 0;
      font-size: 18px;
      color: #808080;
    }

    .editor-card {
      background: #141414;
      border: 1px solid #1a1a1a;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .step-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .step-circle {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: #2a2a2a;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .step-circle.is-active {
      background: #ffffff;
      color: #000000;
    }

    .step-title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }

    .step-content {
      margin-left: 36px;
    }

    .step-help {
      margin: 0 0 14px;
      font-size: 14px;
      color: #808080;
      line-height: 1.5;
    }

    .upload-zone {
      border: 2px dashed #606060;
      border-radius: 12px;
      background: #1a1a1a;
      padding: 48px 32px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .upload-zone:hover {
      border-color: #7a7a7a;
      background: #202020;
    }

    .upload-zone.is-drag {
      border-color: #9a9a9a;
      background: #242424;
    }

    .upload-zone.is-disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .upload-icon {
      font-size: 48px;
      margin-bottom: 8px;
    }

    .upload-title {
      margin: 0 0 4px;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }

    .upload-subtitle {
      margin: 0;
      font-size: 14px;
      color: #808080;
    }

    .upload-meta {
      margin: 12px 0 0;
      font-size: 14px;
      color: #808080;
    }

    .success-box {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #10b981;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
    }

    .divider {
      height: 1px;
      background: #1a1a1a;
      margin: 32px 0;
    }

    .vibe-textarea {
      width: 100%;
      background: #1a1a1a;
      color: #fff;
      border: 1px solid #404040;
      border-radius: 10px;
      padding: 14px;
      font-size: 14px;
      resize: vertical;
      outline: none;
      margin-bottom: 12px;
      min-height: 96px;
    }

    .vibe-textarea:focus {
      border-color: #606060;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.05);
    }

    .vibe-textarea:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .quick-vibes-label {
      font-size: 13px;
      color: #808080;
      margin: 0 0 8px;
    }

    .quick-vibes {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .quick-vibe-btn {
      appearance: none;
      border: 1px solid #404040;
      border-radius: 8px;
      background: #1a1a1a;
      color: #fff;
      font-size: 14px;
      padding: 8px 16px;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .quick-vibe-btn:hover {
      background: #2a2a2a;
      border-color: #606060;
    }

    .quick-vibe-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .primary-btn {
      width: 100%;
      border: 1px solid #fff;
      border-radius: 10px;
      background: #fff;
      color: #000;
      font-size: 16px;
      font-weight: 700;
      padding: 16px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .primary-btn:hover {
      background: #ececec;
    }

    .primary-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .trust-badge {
      border-top: 1px solid #1a1a1a;
      padding-top: 24px;
      margin-top: 24px;
      font-size: 13px;
      color: #606060;
      text-align: center;
    }

    .state-card {
      background: #141414;
      border: 1px solid #1a1a1a;
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .progress-track {
      width: 100%;
      height: 10px;
      background: #252525;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 14px;
    }

    .progress-fill {
      height: 100%;
      background: #ffffff;
      transition: width 0.2s ease;
    }

    .state-muted {
      color: #808080;
      font-size: 14px;
    }

    .state-title {
      margin: 0 0 10px;
      font-size: 26px;
      font-weight: 700;
      color: #fff;
    }

    .state-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 18px;
    }

    .ghost-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border: 1px solid #404040;
      border-radius: 10px;
      color: #fff;
      background: transparent;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .ghost-btn:hover {
      border-color: #606060;
      background: #1a1a1a;
    }

    .footer {
      background: #0a0a0a;
      border-top: 1px solid #1a1a1a;
      padding: 24px;
      margin-top: 60px;
      text-align: center;
      color: #808080;
      font-size: 14px;
    }

    .footer-links {
      margin-bottom: 10px;
    }

    .footer-link {
      color: #ffffff;
      text-decoration: none;
      margin: 0 12px;
    }

    .footer-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 900px) {
      .content {
        padding: 28px 16px;
      }

      .header-title {
        font-size: 36px;
      }

      .editor-card,
      .state-card {
        padding: 24px;
      }

      .upload-zone {
        padding: 40px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="page-wrap" id="root"></div>

  <script type="text/babel">
    const { useEffect, useMemo, useState } = React;

    function TopNav({ onToggleMenu }) {
      const [profileOpen, setProfileOpen] = useState(false);

      useEffect(() => {
        if (!profileOpen) return undefined;
        const onClick = (event) => {
          const wrap = document.querySelector('.profile-wrap');
          if (wrap && !wrap.contains(event.target)) {
            setProfileOpen(false);
          }
        };
        document.addEventListener('click', onClick);
        return () => document.removeEventListener('click', onClick);
      }, [profileOpen]);

      return (
        <header className="top-nav">
          <div className="top-nav__inner">
            <button className="hamburger-btn" aria-label="Toggle navigation" onClick={onToggleMenu}>
              <span className="hamburger-btn__line" />
              <span className="hamburger-btn__line" />
              <span className="hamburger-btn__line" />
            </button>
            <div className="profile-wrap">
              <button className="profile-trigger" aria-label="Open profile menu" onClick={() => setProfileOpen((prev) => !prev)}>
                Z
              </button>
              {profileOpen && (
                <div className="profile-menu">
                  <button type="button">Account</button>
                  <button type="button">Profile</button>
                  <button type="button">Sign out</button>
                </div>
              )}
            </div>
          </div>
        </header>
      );
    }

    function SideDrawer({ open, onClose }) {
      if (!open) return null;
      return (
        <>
          <div className="sidebar-backdrop" onClick={onClose} />
          <aside className="side-drawer is-open" aria-label="Sidebar navigation">
            <p className="side-drawer__title">Workspace</p>
            <a className="side-drawer__link" href="/calendar.html">Calendar</a>
            <a className="side-drawer__link" href="/library.html">Library</a>
            <a className="side-drawer__link is-active" href="/editor">AI Editor</a>
          </aside>
        </>
      );
    }

    function Footer() {
      return (
        <footer className="footer">
          <div className="footer-links">
            <a className="footer-link" href="/calendar.html">Calendar</a>
            <a className="footer-link" href="/library.html">Library</a>
            <a className="footer-link" href="/editor">AI Editor</a>
          </div>
          <div>© 2026 Promptly. By creators, for creators.</div>
        </footer>
      );
    }

    function UploadZone({ disabled, onUploadComplete, userId }) {
      const [isUploading, setIsUploading] = useState(false);
      const [progress, setProgress] = useState(0);
      const [error, setError] = useState(null);
      const [dragActive, setDragActive] = useState(false);

      const uploadFile = (file) => {
        if (!file) return;

        if (file.size > 500 * 1024 * 1024) {
          setError('File too large. Max 500MB.');
          return;
        }

        if (!['video/mp4', 'video/quicktime', 'video/x-msvideo'].includes(file.type)) {
          setError('Invalid file type. Use MP4, MOV, or AVI.');
          return;
        }

        setError(null);
        setIsUploading(true);
        setProgress(0);

        const formData = new FormData();
        formData.append('video', file);
        formData.append('userId', userId);

        const xhr = new XMLHttpRequest();

        xhr.upload.addEventListener('progress', (e) => {
          if (e.lengthComputable) {
            setProgress(Math.round((e.loaded / e.total) * 100));
          }
        });

        xhr.addEventListener('load', () => {
          if (xhr.status === 200) {
            const data = JSON.parse(xhr.responseText);
            onUploadComplete(data.videoUrl, data.fileName);
          } else {
            let message = 'Upload failed';
            try {
              const payload = JSON.parse(xhr.responseText);
              if (payload?.error) message = payload.error;
            } catch (_e) {}
            setError(message);
          }
          setIsUploading(false);
        });

        xhr.addEventListener('error', () => {
          setError('Upload failed');
          setIsUploading(false);
        });

        xhr.open('POST', '/api/upload');
        xhr.send(formData);
      };

      const handleDrop = (e) => {
        e.preventDefault();
        if (disabled || isUploading) return;
        setDragActive(false);
        uploadFile(e.dataTransfer.files[0]);
      };

      const handleChange = (e) => {
        if (disabled || isUploading) return;
        uploadFile(e.target.files[0]);
      };

      return (
        <div>
          <div
            className={`upload-zone ${dragActive ? 'is-drag' : ''} ${disabled || isUploading ? 'is-disabled' : ''}`}
            onDrop={handleDrop}
            onDragOver={(e) => {
              e.preventDefault();
              if (disabled || isUploading) return;
              setDragActive(true);
            }}
            onDragLeave={() => setDragActive(false)}
            onClick={() => {
              if (disabled || isUploading) return;
              const input = document.getElementById('editor-file-input');
              if (input) input.click();
            }}
          >
            <input
              id="editor-file-input"
              type="file"
              accept="video/mp4,video/quicktime,video/x-msvideo"
              onChange={handleChange}
              style={{ display: 'none' }}
            />

            {isUploading ? (
              <div>
                <p className="upload-title">Uploading...</p>
                <div className="progress-track">
                  <div className="progress-fill" style={{ width: `${progress}%` }} />
                </div>
                <p className="upload-meta" style={{ marginTop: '10px' }}>{progress}%</p>
              </div>
            ) : (
              <div>
                <div className="upload-icon">📤</div>
                <p className="upload-title">Drop your video here</p>
                <p className="upload-subtitle">or click to browse</p>
                <p className="upload-meta">MP4, MOV, AVI • Max 500MB</p>
              </div>
            )}
          </div>
          {error ? <div style={{ marginTop: '10px' }} className="success-box">{error}</div> : null}
        </div>
      );
    }

    function EditorCard({
      videoUrl,
      videoFileName,
      vibe,
      setVibe,
      onUploadComplete,
      onGenerate,
      generating,
      userId,
    }) {
      const step1Active = !videoUrl;
      const step2Active = Boolean(videoUrl);

      const quickVibes = useMemo(() => ([
        { label: 'Punchy TikTok', value: 'punchy TikTok with fast cuts and meme SFX' },
        { label: 'Cinematic Reels', value: 'smooth cinematic Instagram Reels' },
        { label: 'Comedy Chaos', value: 'chaotic comedy with zooms and shake effects' },
        { label: 'Smooth & Minimal', value: 'smooth and minimal aesthetic with subtle transitions' },
      ]), []);

      const canGenerate = Boolean(videoUrl && vibe.trim() && !generating);

      return (
        <section className="editor-card">
          <div>
            <div className="step-row">
              <span className={`step-circle ${step1Active ? 'is-active' : ''}`}>1</span>
              <h2 className="step-title">Upload Your Clip</h2>
            </div>
            <div className="step-content">
              <p className="step-help">Use a clear talking-head or storytelling clip for best results</p>
              {!videoUrl ? (
                <UploadZone disabled={generating} onUploadComplete={onUploadComplete} userId={userId} />
              ) : (
                <div className="success-box">✓ Video uploaded: {videoFileName}</div>
              )}
            </div>
          </div>

          <div className="divider" />

          <div>
            <div className="step-row">
              <span className={`step-circle ${step2Active ? 'is-active' : ''}`}>2</span>
              <h2 className="step-title">Describe The Vibe</h2>
            </div>
            <div className="step-content">
              <textarea
                className="vibe-textarea"
                rows={3}
                placeholder="e.g., punchy TikTok with fast cuts and meme SFX"
                disabled={!videoUrl || generating}
                value={vibe}
                onChange={(e) => setVibe(e.target.value)}
              />

              <p className="quick-vibes-label">Quick vibes:</p>
              <div className="quick-vibes">
                {quickVibes.map((item) => (
                  <button
                    key={item.label}
                    type="button"
                    className="quick-vibe-btn"
                    disabled={!videoUrl || generating}
                    onClick={() => setVibe(item.value)}
                  >
                    {item.label}
                  </button>
                ))}
              </div>

              <button className="primary-btn" disabled={!canGenerate} onClick={onGenerate}>
                {generating ? 'Generating...' : 'Generate Edited Video'}
              </button>
            </div>
          </div>

          <div className="trust-badge">⚡ Powered by AI • Estimated time: 60-90 seconds</div>
        </section>
      );
    }

    function ProcessingState({ status, progress }) {
      return (
        <section className="state-card">
          <h2 className="state-title">Creating your video...</h2>
          <p className="state-muted">
            {status === 'queued' && 'Queued...'}
            {status === 'analyzing' && 'Analyzing clip...'}
            {status === 'editing' && 'Generating edit recipe...'}
            {status === 'rendering' && 'Rendering video...'}
          </p>
          <div className="progress-track">
            <div className="progress-fill" style={{ width: `${progress}%` }} />
          </div>
          <p className="state-muted" style={{ marginTop: '10px' }}>{progress}%</p>
        </section>
      );
    }

    function CompleteState({ renderedVideoUrl, onReset }) {
      return (
        <section className="state-card">
          <h2 className="state-title">Your video is ready</h2>
          <video src={renderedVideoUrl} controls className="w-full" style={{ maxWidth: '460px', borderRadius: '12px', border: '1px solid #404040', margin: '0 auto' }} />
          <div className="state-actions">
            <a href={renderedVideoUrl} download className="primary-btn" style={{ width: 'auto', minWidth: '170px', textDecoration: 'none' }}>
              Download Video
            </a>
            <button className="ghost-btn" onClick={onReset}>Edit Another Video</button>
          </div>
        </section>
      );
    }

    function ErrorState({ error, onReset }) {
      return (
        <section className="state-card">
          <h2 className="state-title">Something went wrong</h2>
          <p className="state-muted" style={{ marginBottom: '18px' }}>{error || 'Failed to process your video.'}</p>
          <button className="ghost-btn" onClick={onReset}>Try Again</button>
        </section>
      );
    }

    function App() {
      const [drawerOpen, setDrawerOpen] = useState(false);
      const [userId] = useState(() => `user-${Math.random().toString(36).slice(2, 11)}`);
      const [videoUrl, setVideoUrl] = useState(null);
      const [videoFileName, setVideoFileName] = useState('');
      const [vibe, setVibe] = useState('');
      const [jobId, setJobId] = useState(null);
      const [status, setStatus] = useState('idle');
      const [progress, setProgress] = useState(0);
      const [renderedVideoUrl, setRenderedVideoUrl] = useState(null);
      const [error, setError] = useState(null);
      const [submitting, setSubmitting] = useState(false);

      useEffect(() => {
        if (!jobId) return undefined;

        const interval = setInterval(async () => {
          try {
            const response = await fetch(`/api/jobs/${jobId}`);
            if (!response.ok) return;
            const data = await response.json();

            setStatus(data.status || 'queued');
            setProgress(data.progress || 0);
            setRenderedVideoUrl(data.rendered_video_url || null);
            setError(data.error || null);

            if (data.status === 'complete' || data.status === 'error') {
              clearInterval(interval);
            }
          } catch (pollError) {
            console.error('Polling failed:', pollError);
          }
        }, 2000);

        return () => clearInterval(interval);
      }, [jobId]);

      const onUploadComplete = (url, fileName) => {
        setVideoUrl(url);
        setVideoFileName(fileName || 'video');
        setError(null);
      };

      const onGenerate = async () => {
        if (!videoUrl || !vibe.trim()) return;

        try {
          setSubmitting(true);
          setError(null);

          const response = await fetch('/api/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ videoUrl, vibeInput: vibe.trim(), userId }),
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data?.error || 'Failed to create job');
          }

          setJobId(data.jobId);
          setStatus('queued');
          setProgress(0);
        } catch (generateError) {
          setError(generateError.message || 'Failed to create job');
        } finally {
          setSubmitting(false);
        }
      };

      const onReset = () => {
        setVideoUrl(null);
        setVideoFileName('');
        setVibe('');
        setJobId(null);
        setStatus('idle');
        setProgress(0);
        setRenderedVideoUrl(null);
        setError(null);
        setSubmitting(false);
      };

      const showWorkflow = !jobId;
      const showProcessing = jobId && status !== 'complete' && status !== 'error';
      const showComplete = status === 'complete' && renderedVideoUrl;
      const showError = status === 'error';

      return (
        <>
          <TopNav onToggleMenu={() => setDrawerOpen((prev) => !prev)} />
          <SideDrawer open={drawerOpen} onClose={() => setDrawerOpen(false)} />

          <div className="content">
            <div className="content-inner">
              <div className="header-block">
                <h1 className="header-title">AI Video Editor</h1>
                <p className="header-subtitle">Turn raw clips into viral videos</p>
              </div>

              {showWorkflow ? (
                <EditorCard
                  videoUrl={videoUrl}
                  videoFileName={videoFileName}
                  vibe={vibe}
                  setVibe={setVibe}
                  onUploadComplete={onUploadComplete}
                  onGenerate={onGenerate}
                  generating={submitting}
                  userId={userId}
                />
              ) : null}

              {showProcessing ? (
                <ProcessingState status={status} progress={progress} />
              ) : null}

              {showComplete ? (
                <CompleteState renderedVideoUrl={renderedVideoUrl} onReset={onReset} />
              ) : null}

              {showError ? (
                <ErrorState error={error} onReset={onReset} />
              ) : null}
            </div>
          </div>

          <Footer />
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
