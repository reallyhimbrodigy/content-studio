<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Promptly · AI Video Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body.page-editor,
      body.page-editor .app-main,
      body.page-editor main.editor-main {
        background: #121212 !important;
      }

      .editor-main {
        width: 100%;
        max-width: 1000px;
        margin: 0 auto;
        padding: 40px 24px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .editor-topbar {
        display: flex;
        justify-content: flex-end;
        align-items: center;
      }

      .page-editor .user-tier-badge {
        background: #ffffff;
        color: #000000;
        border: 1px solid rgba(0, 0, 0, 0.15);
        font-weight: 700;
      }

      .editor-container {
        width: min(800px, 100%);
        margin: 0 auto;
      }

      .editor-hero {
        text-align: center;
        margin-bottom: 8px;
      }

      .editor-hero__title {
        margin: 0 0 8px;
        font-size: 32px;
        line-height: 1.1;
        letter-spacing: -0.02em;
        font-weight: 700;
        color: #ffffff;
      }

      .editor-hero__subtitle {
        margin: 0 auto 48px;
        max-width: 700px;
        font-size: 16px;
        font-weight: 400;
        color: #909090;
      }

      .editor-card {
        background: #1a1a1a;
        border: 2px solid #2a2a2a;
        border-radius: 16px;
        padding: 24px;
        margin-bottom: 0;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        transition: all 0.3s ease;
      }

      .editor-card.is-drag {
        border-color: #ffffff;
        background: rgba(255, 255, 255, 0.02);
      }

      .composer-header {
        display: flex;
        align-items: center;
        margin-bottom: 12px;
      }

      .attach-button {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        background: #2a2a2a;
        border: 1px solid #404040;
        color: #ffffff;
        font-size: 24px;
        line-height: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .attach-button:hover {
        background: #353535;
        border-color: #505050;
      }

      .composer-textarea {
        width: 100%;
        min-height: 200px;
        resize: vertical;
        background: transparent;
        border: none;
        color: #ffffff;
        font-size: 16px;
        line-height: 1.6;
        padding: 16px;
      }

      .composer-textarea::placeholder {
        color: #606060;
      }

      .composer-textarea:focus {
        outline: none;
        box-shadow: none;
      }

      .upload-progress-wrap {
        margin-top: 16px;
      }

      .upload-progress-label {
        margin: 0 0 8px;
        font-size: 14px;
        color: #a0a0a0;
      }

      .attached-file {
        margin-top: 16px;
        background: #0f0f0f;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        padding: 12px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .attached-file__info {
        color: #e0e0e0;
        font-size: 14px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .attached-file__remove {
        border: none;
        background: transparent;
        color: #808080;
        cursor: pointer;
        font-size: 14px;
        padding: 0;
      }

      .attached-file__remove:hover {
        color: #ffffff;
      }

      .composer-generate {
        width: 100%;
        height: 56px;
        margin-top: 20px;
        border: none;
        border-radius: 12px;
        background: #ffffff;
        color: #000000;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .composer-generate:hover:enabled {
        background: #f5f5f5;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
      }

      .composer-generate:disabled {
        background: #2a2a2a;
        color: #606060;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .trust-badge {
        padding: 0;
        margin-top: 24px;
        font-size: 13px;
        color: #707070;
        text-align: center;
      }

      .state-card {
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 20px;
        padding: 60px;
        text-align: center;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        transition: all 0.3s ease;
      }

      .state-title {
        margin: 0 0 12px;
        font-size: 1.6rem;
      }

      .state-muted {
        color: #9a9a9a;
      }

      .progress-track {
        width: 100%;
        height: 8px;
        background: #2a2a2a;
        border-radius: 999px;
        overflow: hidden;
        margin-top: 24px;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #ffffff 0%, #e0e0e0 100%);
        transition: width 0.3s ease;
      }

      .state-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-top: 16px;
      }

      .video-preview {
        width: min(600px, 100%);
        border-radius: 16px;
        border: 1px solid #2a2a2a;
        margin: 0 auto;
        box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
      }

      @media (max-width: 980px) {
        .editor-main {
          padding: 24px 20px;
        }

        .editor-hero__title {
          font-size: 24px;
        }

        .editor-hero__subtitle {
          font-size: 15px;
          margin-bottom: 24px;
        }

        .editor-card,
        .state-card {
          padding: 24px;
          margin-bottom: 24px;
        }
      }

      body.page-editor .profile-menu-item.danger {
        background: #ef4444;
        color: #ffffff;
        border: none;
      }

      body.page-editor .profile-menu-item.danger:hover,
      body.page-editor .profile-menu-item.danger:focus,
      body.page-editor .profile-menu-item.danger:active,
      body.page-editor .profile-menu-item.danger:focus-visible {
        background: #dc2626;
        color: #ffffff;
      }

      body.page-editor .profile-menu-item.danger svg {
        color: #ffffff;
      }
    </style>
  </head>
  <body class="page-editor">
    <div class="app-shell editor-page">
      <div class="app-layout" id="app-layout">
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle navigation" aria-expanded="false">
          <span class="sidebar-toggle__bars" aria-hidden="true"></span>
        </button>
        <aside class="app-sidebar collapsed" id="app-sidebar">
          <div class="sidebar-fixed-inner">
            <nav class="sidebar-nav" aria-label="Workspace navigation">
              <a href="/calendar.html" class="sidebar-link">
                <span>Content Calendar</span>
              </a>
              <a href="/editor" class="sidebar-link is-active" aria-current="page">
                <span>AI Editor</span>
              </a>
              <a href="/library.html" class="sidebar-link">
                <span>Library</span>
              </a>
            </nav>
          </div>
        </aside>

        <div class="app-main">
          <div class="editor-topbar">
            <div id="user-menu" class="user-menu" style="display:flex; align-items:center; gap:0.75rem;">
              <div class="hero-topbar">
                <div class="profile-wrapper">
                  <span id="user-tier-badge" class="user-tier-badge" style="display:inline-flex;">PRO</span>
                  <button id="profile-trigger" class="profile-trigger" aria-haspopup="true" aria-expanded="false" aria-label="Open profile menu">
                    <span id="profile-initial" aria-hidden="true">Z</span>
                  </button>
                  <div id="profile-menu" class="profile-menu" style="display:none;">
                    <div id="profile-dropdown" class="profile-dropdown">
                      <p class="profile-pronouns" id="user-pronouns" style="display:none;"></p>
                      <button id="account-overview-btn" class="profile-menu-item">Account</button>
                      <button id="profile-settings-btn" class="profile-menu-item">Profile &amp; accessibility</button>
                      <button id="password-settings-btn" class="profile-menu-item">Password &amp; security</button>
                      <button id="manage-billing-btn" class="profile-menu-item">Manage billing</button>
                      <button id="sign-out-btn" class="profile-menu-item danger">Sign out</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <main class="editor-main">
            <div class="editor-container" id="editor-react-root"></div>
          </main>
          <footer class="footer"></footer>
        </div>
      </div>
    </div>

    <div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>

    <script type="module" src="footer.js"></script>

    <script>
      const SIDEBAR_STORAGE_KEY = 'promptly_sidebar_collapsed';
      const isMobileViewport = () => window.matchMedia('(max-width: 768px)').matches;

      const appLayout = document.getElementById('app-layout');
      const appSidebar = document.getElementById('app-sidebar');
      const sidebarToggle = document.getElementById('sidebar-toggle');
      const sidebarBackdrop = document.getElementById('sidebar-backdrop');

      const profileMenu = document.getElementById('profile-menu');
      const profileTrigger = document.getElementById('profile-trigger');

      function applySidebarState(collapsed) {
        if (!appSidebar || !appLayout || !sidebarToggle) return;
        appSidebar.classList.toggle('collapsed', collapsed);
        appLayout.classList.toggle('sidebar-collapsed', collapsed);
        sidebarToggle.setAttribute('aria-expanded', String(!collapsed));

        try {
          localStorage.setItem(SIDEBAR_STORAGE_KEY, collapsed ? '1' : '0');
        } catch (_) {}

        if (isMobileViewport()) {
          if (!collapsed) {
            document.documentElement.style.overflow = 'hidden';
            document.body.style.overflow = 'hidden';
          } else {
            document.documentElement.style.overflow = '';
            document.body.style.overflow = '';
          }
        } else {
          document.documentElement.style.overflow = '';
          document.body.style.overflow = '';
        }

        if (sidebarBackdrop) {
          sidebarBackdrop.classList.toggle('visible', !collapsed && isMobileViewport());
        }
        document.body.classList.toggle('sidebar-open', !collapsed && isMobileViewport());
      }

      function initSidebar() {
        if (!appSidebar || !sidebarToggle || !appLayout) return;
        let collapsed = true;
        try {
          const stored = localStorage.getItem(SIDEBAR_STORAGE_KEY);
          if (stored === null) {
            collapsed = true;
            localStorage.setItem(SIDEBAR_STORAGE_KEY, '1');
          } else {
            collapsed = stored === '1';
          }
        } catch (_) {}

        applySidebarState(collapsed);

        sidebarToggle.addEventListener('click', () => {
          const next = !appLayout.classList.contains('sidebar-collapsed');
          applySidebarState(next);
        });
      }

      function closeProfileMenu() {
        if (profileMenu) profileMenu.style.display = 'none';
        if (profileTrigger) profileTrigger.setAttribute('aria-expanded', 'false');
        document.body.classList.remove('profile-menu-open');
      }

      function toggleProfileMenu() {
        if (!profileMenu || !profileTrigger) return;
        const isOpen = profileMenu.style.display === 'block';
        if (isOpen) {
          closeProfileMenu();
        } else {
          profileMenu.style.display = 'block';
          profileTrigger.setAttribute('aria-expanded', 'true');
          document.body.classList.add('profile-menu-open');
        }
      }

      initSidebar();

      if (sidebarBackdrop) {
        sidebarBackdrop.addEventListener('click', () => applySidebarState(true));
      }

      if (profileTrigger) {
        profileTrigger.addEventListener('click', (event) => {
          event.preventDefault();
          event.stopPropagation();
          toggleProfileMenu();
        });
      }

      if (profileMenu) {
        profileMenu.addEventListener('click', (event) => {
          event.stopPropagation();
        });
      }

      document.addEventListener('click', (event) => {
        if (!profileMenu || !profileTrigger) return;
        const target = event.target;
        if (profileTrigger.contains(target)) return;
        closeProfileMenu();
      });

      document.getElementById('account-overview-btn')?.addEventListener('click', () => {
        window.location.href = '/#account';
      });
      document.getElementById('profile-settings-btn')?.addEventListener('click', () => {
        window.location.href = '/#profile-settings';
      });
      document.getElementById('password-settings-btn')?.addEventListener('click', () => {
        window.location.href = 'reset-password.html';
      });
      document.getElementById('manage-billing-btn')?.addEventListener('click', async (event) => {
        event.preventDefault();
        try {
          const resp = await fetch('/api/billing/portal', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ returnUrl: window.location.href })
          });
          const data = await resp.json().catch(() => ({}));
          if (resp.ok && data?.url) {
            window.location.href = data.url;
          } else {
            alert(data?.error || 'Billing portal is not configured yet.');
          }
        } catch (_) {
          alert('Billing portal unavailable. Please try again later.');
        }
      });
      document.getElementById('sign-out-btn')?.addEventListener('click', async (event) => {
        event.preventDefault();
        event.stopPropagation();
        try {
          if (typeof window.storeSignOut === 'function') {
            await window.storeSignOut();
          } else {
            const sb = window?.supabase || window?.supabaseClient || null;
            if (sb?.auth?.signOut) {
              await sb.auth.signOut();
            }
          }
        } catch (_) {}
        window.location.replace('auth.html');
      });
    </script>

    <script type="text/babel">
      const { useEffect, useState } = React;

      function EditorCard({
        videoUrl,
        videoFileName,
        videoFileSize,
        vibe,
        setVibe,
        onUploadComplete,
        onRemoveUpload,
        onGenerate,
        generating,
        userId,
      }) {
        const [isUploading, setIsUploading] = useState(false);
        const [progress, setProgress] = useState(0);
        const [error, setError] = useState(null);
        const [dragActive, setDragActive] = useState(false);
        const canGenerate = Boolean(videoUrl && vibe.trim() && !generating && !isUploading);
        const formatFileSize = (bytes) => {
          const value = Number(bytes || 0);
          if (!Number.isFinite(value) || value <= 0) return '';
          const mb = value / (1024 * 1024);
          return `(${mb.toFixed(1)} MB)`;
        };

        const uploadFile = (file) => {
          if (!file) return;
          if (file.size > 500 * 1024 * 1024) {
            setError('File too large. Max 500MB.');
            return;
          }
          if (!['video/mp4', 'video/quicktime', 'video/x-msvideo'].includes(file.type)) {
            setError('Invalid file type. Use MP4, MOV, or AVI.');
            return;
          }
          setError(null);
          setIsUploading(true);
          setProgress(0);

          const formData = new FormData();
          formData.append('video', file);
          formData.append('userId', userId);

          const xhr = new XMLHttpRequest();
          xhr.upload.addEventListener('progress', (e) => {
            if (e.lengthComputable) {
              setProgress(Math.round((e.loaded / e.total) * 100));
            }
          });
          xhr.addEventListener('load', () => {
            if (xhr.status === 200) {
              const data = JSON.parse(xhr.responseText);
              onUploadComplete(data.videoUrl, data.fileName || file.name, file.size);
            } else {
              let message = 'Upload failed';
              try {
                const payload = JSON.parse(xhr.responseText);
                if (payload?.error) message = payload.error;
              } catch (_e) {}
              setError(message);
            }
            setIsUploading(false);
          });
          xhr.addEventListener('error', () => {
            setError('Upload failed');
            setIsUploading(false);
          });
          xhr.open('POST', '/api/upload');
          xhr.send(formData);
        };

        return (
          <section
            className={`editor-card ${dragActive ? 'is-drag' : ''}`}
            onDrop={(e) => {
              e.preventDefault();
              if (generating || isUploading) return;
              setDragActive(false);
              uploadFile(e.dataTransfer.files[0]);
            }}
            onDragOver={(e) => {
              e.preventDefault();
              if (generating || isUploading) return;
              setDragActive(true);
            }}
            onDragLeave={() => setDragActive(false)}
          >
            <div className="composer-header">
              <button
                type="button"
                className="attach-button"
                onClick={() => {
                  if (generating || isUploading) return;
                  const input = document.getElementById('editor-file-input');
                  if (input) input.click();
                }}
                aria-label="Attach video"
              >
                +
              </button>
              <input
                id="editor-file-input"
                type="file"
                accept="video/mp4,video/quicktime,video/x-msvideo"
                style={{ display: 'none' }}
                onChange={(e) => {
                  if (generating || isUploading) return;
                  uploadFile(e.target.files[0]);
                  e.target.value = '';
                }}
              />
            </div>

            <textarea
              className="composer-textarea"
              rows={8}
              placeholder="Describe the vibe you want... (e.g., punchy TikTok with fast cuts and meme SFX)"
              disabled={generating || isUploading}
              value={vibe}
              onChange={(e) => setVibe(e.target.value)}
            />

            {isUploading ? (
              <div className="upload-progress-wrap">
                <p className="upload-progress-label">Uploading... {progress}%</p>
                <div className="progress-track">
                  <div className="progress-fill" style={{ width: `${progress}%` }} />
                </div>
              </div>
            ) : null}

            {videoUrl ? (
              <div className="attached-file">
                <span className="attached-file__info">📎 {videoFileName} {formatFileSize(videoFileSize)}</span>
                <button type="button" className="attached-file__remove" onClick={onRemoveUpload}>
                  Remove
                </button>
              </div>
            ) : null}

            {error ? (
              <div style={{ marginTop: '16px', color: '#f87171', fontSize: '14px' }}>{error}</div>
            ) : null}

            <button className="composer-generate" disabled={!canGenerate} onClick={onGenerate}>
              {generating ? 'Generating...' : 'Generate Edited Video'}
            </button>
          </section>
        );
      }

      function ProcessingState({ status, progress }) {
        return (
          <section className="state-card">
            <h2 className="state-title">Creating your video...</h2>
            <p className="state-muted">
              {status === 'queued' && 'Queued...'}
              {status === 'analyzing' && 'Analyzing clip...'}
              {status === 'editing' && 'Generating edit recipe...'}
              {status === 'rendering' && 'Rendering video...'}
            </p>
            <div className="progress-track">
              <div className="progress-fill" style={{ width: `${progress}%` }} />
            </div>
            <p className="state-muted" style={{ marginTop: '10px' }}>{progress}%</p>
          </section>
        );
      }

      function CompleteState({ renderedVideoUrl, onReset }) {
        return (
          <section className="state-card">
            <h2 className="state-title">Your video is ready</h2>
            <video src={renderedVideoUrl} controls className="video-preview" />
            <div className="state-actions">
              <a href={renderedVideoUrl} download className="secondary" style={{ textDecoration: 'none' }}>
                Download Video
              </a>
              <button className="ghost" onClick={onReset}>Edit Another Video</button>
            </div>
          </section>
        );
      }

      function ErrorState({ error, onReset }) {
        return (
          <section className="state-card">
            <h2 className="state-title">Something went wrong</h2>
            <p className="state-muted" style={{ marginBottom: '18px' }}>{error || 'Failed to process your video.'}</p>
            <button className="ghost" onClick={onReset}>Try Again</button>
          </section>
        );
      }

      function App() {
        const [userId] = useState(() => `user-${Math.random().toString(36).slice(2, 11)}`);
        const [videoUrl, setVideoUrl] = useState(null);
        const [videoFileName, setVideoFileName] = useState('');
        const [videoFileSize, setVideoFileSize] = useState(0);
        const [vibe, setVibe] = useState('');
        const [jobId, setJobId] = useState(null);
        const [status, setStatus] = useState('idle');
        const [progress, setProgress] = useState(0);
        const [renderedVideoUrl, setRenderedVideoUrl] = useState(null);
        const [error, setError] = useState(null);
        const [submitting, setSubmitting] = useState(false);

        useEffect(() => {
          if (!jobId) return undefined;

          const interval = setInterval(async () => {
            try {
              const response = await fetch(`/api/jobs/${jobId}`);
              if (!response.ok) return;
              const data = await response.json();

              setStatus(data.status || 'queued');
              setProgress(data.progress || 0);
              setRenderedVideoUrl(data.rendered_video_url || null);
              setError(data.error || null);

              if (data.status === 'complete' || data.status === 'error') {
                clearInterval(interval);
              }
            } catch (pollError) {
              console.error('Polling failed:', pollError);
            }
          }, 2000);

          return () => clearInterval(interval);
        }, [jobId]);

        const onUploadComplete = (url, fileName, fileSize = 0) => {
          setVideoUrl(url);
          setVideoFileName(fileName || 'video');
          setVideoFileSize(Number(fileSize || 0));
          setError(null);
        };

        const onRemoveUpload = () => {
          setVideoUrl(null);
          setVideoFileName('');
          setVideoFileSize(0);
        };

        const onGenerate = async () => {
          if (!videoUrl || !vibe.trim()) return;

          try {
            setSubmitting(true);
            setError(null);

            const response = await fetch('/api/generate', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ videoUrl, vibeInput: vibe.trim(), userId }),
            });

            const data = await response.json();
            if (!response.ok) {
              throw new Error(data?.error || 'Failed to create job');
            }

            setJobId(data.jobId);
            setStatus('queued');
            setProgress(0);
          } catch (generateError) {
            setError(generateError.message || 'Failed to create job');
          } finally {
            setSubmitting(false);
          }
        };

        const onReset = () => {
          setVideoUrl(null);
          setVideoFileName('');
          setVideoFileSize(0);
          setVibe('');
          setJobId(null);
          setStatus('idle');
          setProgress(0);
          setRenderedVideoUrl(null);
          setError(null);
          setSubmitting(false);
        };

        const showWorkflow = !jobId;
        const showProcessing = jobId && status !== 'complete' && status !== 'error';
        const showComplete = status === 'complete' && renderedVideoUrl;
        const showError = status === 'error';

        return (
          <>
            <header className="editor-hero">
              <h1 className="editor-hero__title">AI Video Editor</h1>
              <p className="editor-hero__subtitle">Turn raw clips into viral videos</p>
            </header>

            {showWorkflow ? (
              <EditorCard
                videoUrl={videoUrl}
                videoFileName={videoFileName}
                videoFileSize={videoFileSize}
                vibe={vibe}
                setVibe={setVibe}
                onUploadComplete={onUploadComplete}
                onRemoveUpload={onRemoveUpload}
                onGenerate={onGenerate}
                generating={submitting}
                userId={userId}
              />
            ) : null}

            {showProcessing ? (
              <ProcessingState status={status} progress={progress} />
            ) : null}

            {showComplete ? (
              <CompleteState renderedVideoUrl={renderedVideoUrl} onReset={onReset} />
            ) : null}

            {showError ? (
              <ErrorState error={error} onReset={onReset} />
            ) : null}

            {showWorkflow ? (
              <div className="trust-badge">⚡ Powered by Claude Opus 4.6 • 60-90 seconds</div>
            ) : null}
          </>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('editor-react-root'));
      root.render(<App />);
    </script>
  </body>
</html>
