<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Promptly · AI Video Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      .editor-page .hero-topbar,
      .editor-page .hero-controls {
        display: contents;
      }

      .editor-main {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      .editor-container {
        width: min(860px, 100%);
        margin: 0 auto;
      }

      .editor-card {
        background: var(--surface);
        border: 1px solid var(--card-border);
        border-radius: 20px;
        padding: clamp(1.25rem, 2vw, 2rem);
        box-shadow: 0 14px 32px rgba(0, 0, 0, 0.35);
      }

      .step-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }

      .step-circle {
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
      }

      .step-circle.is-active {
        background: #fff;
        color: #000;
      }

      .step-title {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--text-primary);
      }

      .step-content {
        margin-left: 36px;
      }

      .step-help {
        margin: 0 0 14px;
        font-size: 0.92rem;
        color: var(--text-secondary);
      }

      .upload-zone {
        border: 2px dashed rgba(255, 255, 255, 0.32);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.04);
        padding: clamp(1.75rem, 3vw, 2.5rem);
        text-align: center;
        cursor: pointer;
        transition: border-color 0.2s ease, background 0.2s ease;
      }

      .upload-zone:hover {
        border-color: rgba(255, 255, 255, 0.52);
        background: rgba(255, 255, 255, 0.08);
      }

      .upload-zone.is-drag {
        border-color: rgba(255, 255, 255, 0.66);
        background: rgba(255, 255, 255, 0.1);
      }

      .upload-zone.is-disabled {
        opacity: 0.62;
        cursor: not-allowed;
      }

      .upload-icon {
        font-size: 44px;
        margin-bottom: 8px;
      }

      .upload-title {
        margin: 0 0 4px;
        font-size: 18px;
        font-weight: 700;
        color: var(--text-primary);
      }

      .upload-subtitle {
        margin: 0;
        font-size: 14px;
        color: var(--text-secondary);
      }

      .upload-meta {
        margin: 12px 0 0;
        font-size: 14px;
        color: var(--text-secondary);
      }

      .status-box {
        border-radius: 10px;
        padding: 12px 16px;
        font-size: 14px;
        font-weight: 600;
      }

      .status-box.success {
        background: rgba(16, 185, 129, 0.15);
        border: 1px solid rgba(16, 185, 129, 0.35);
        color: #10b981;
      }

      .status-box.error {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.35);
        color: #f87171;
      }

      .divider {
        height: 1px;
        background: var(--card-border);
        margin: 32px 0;
      }

      .vibe-textarea {
        width: 100%;
        min-height: 96px;
        resize: vertical;
        margin-bottom: 12px;
      }

      .vibe-textarea:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .quick-vibes-label {
        font-size: 13px;
        color: var(--text-secondary);
        margin: 0 0 8px;
      }

      .quick-vibes {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }

      .quick-vibe-btn {
        appearance: none;
        border: 1px solid var(--card-border);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.06);
        color: var(--text-primary);
        font-size: 14px;
        padding: 8px 16px;
        cursor: pointer;
      }

      .quick-vibe-btn:hover {
        background: rgba(255, 255, 255, 0.12);
        border-color: rgba(255, 255, 255, 0.34);
      }

      .quick-vibe-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .primary-btn {
        width: 100%;
      }

      .trust-badge {
        border-top: 1px solid var(--card-border);
        padding-top: 20px;
        margin-top: 22px;
        font-size: 13px;
        color: var(--text3);
        text-align: center;
      }

      .state-card {
        background: var(--surface);
        border: 1px solid var(--card-border);
        border-radius: 20px;
        padding: clamp(1.25rem, 2vw, 2rem);
        text-align: center;
      }

      .state-title {
        margin: 0 0 8px;
        font-size: 1.6rem;
      }

      .state-muted {
        color: var(--text-secondary);
      }

      .progress-track {
        width: 100%;
        height: 10px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        overflow: hidden;
        margin-top: 14px;
      }

      .progress-fill {
        height: 100%;
        background: #fff;
        transition: width 0.2s ease;
      }

      .state-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-top: 16px;
      }

      .video-preview {
        width: min(460px, 100%);
        border-radius: 12px;
        border: 1px solid var(--card-border);
        margin: 0 auto;
      }
    </style>
  </head>
  <body class="page-editor">
    <div class="app-shell editor-page">
      <div class="app-layout" id="app-layout">
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle navigation" aria-expanded="false">
          <span class="sidebar-toggle__bars" aria-hidden="true"></span>
        </button>
        <aside class="app-sidebar collapsed" id="app-sidebar">
          <div class="sidebar-fixed-inner">
            <nav class="sidebar-nav" aria-label="Workspace navigation">
              <a href="/calendar.html" class="sidebar-link">
                <span>Content Calendar</span>
              </a>
              <a href="/editor" class="sidebar-link is-active" aria-current="page">
                <span>AI Editor</span>
              </a>
              <a href="/library.html" class="sidebar-link">
                <span>Library</span>
              </a>
            </nav>
          </div>
        </aside>

        <div class="app-main">
          <header class="hero app-hero">
            <div class="hero-top">
              <div class="hero-top__left">
                <img src="assets/promptly-mark-white.png" alt="Promptly logo" class="logo" />
                <span class="hero-pill hero-pill--subtle">By Creators, For Creators</span>
              </div>
              <div id="user-menu" class="user-menu" style="display:flex; align-items:center; gap:0.75rem;">
                <div class="hero-topbar">
                  <div class="profile-wrapper">
                    <button id="profile-trigger" class="profile-trigger" aria-haspopup="true" aria-expanded="false" aria-label="Open profile menu">
                      <span id="profile-initial" aria-hidden="true">P</span>
                    </button>
                    <div id="profile-menu" class="profile-menu" style="display:none;">
                      <div id="profile-dropdown" class="profile-dropdown">
                        <p class="profile-pronouns" id="user-pronouns" style="display:none;"></p>
                        <button id="account-overview-btn" class="profile-menu-item">Account</button>
                        <button id="profile-settings-btn" class="profile-menu-item">Profile &amp; accessibility</button>
                        <button id="password-settings-btn" class="profile-menu-item">Password &amp; security</button>
                        <button id="manage-billing-btn" class="profile-menu-item">Manage billing</button>
                        <button id="sign-out-btn" class="profile-menu-item danger">Sign out</button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <h1>AI Video Editor</h1>
            <p class="hero-tagline">Turn raw clips into viral videos.</p>
          </header>

          <main class="editor-main">
            <div class="editor-container" id="editor-react-root"></div>
          </main>
        </div>
      </div>

      <footer class="footer"></footer>
    </div>

    <div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>

    <script type="module" src="footer.js"></script>

    <script>
      const SIDEBAR_STORAGE_KEY = 'promptly_sidebar_collapsed';
      const isMobileViewport = () => window.matchMedia('(max-width: 768px)').matches;

      const appLayout = document.getElementById('app-layout');
      const appSidebar = document.getElementById('app-sidebar');
      const sidebarToggle = document.getElementById('sidebar-toggle');
      const sidebarBackdrop = document.getElementById('sidebar-backdrop');

      const profileMenu = document.getElementById('profile-menu');
      const profileTrigger = document.getElementById('profile-trigger');

      function applySidebarState(collapsed) {
        if (!appSidebar || !appLayout || !sidebarToggle) return;
        appSidebar.classList.toggle('collapsed', collapsed);
        appLayout.classList.toggle('sidebar-collapsed', collapsed);
        sidebarToggle.setAttribute('aria-expanded', String(!collapsed));

        try {
          localStorage.setItem(SIDEBAR_STORAGE_KEY, collapsed ? '1' : '0');
        } catch (_) {}

        if (isMobileViewport()) {
          if (!collapsed) {
            document.documentElement.style.overflow = 'hidden';
            document.body.style.overflow = 'hidden';
          } else {
            document.documentElement.style.overflow = '';
            document.body.style.overflow = '';
          }
        } else {
          document.documentElement.style.overflow = '';
          document.body.style.overflow = '';
        }

        if (sidebarBackdrop) {
          sidebarBackdrop.classList.toggle('visible', !collapsed && isMobileViewport());
        }
        document.body.classList.toggle('sidebar-open', !collapsed && isMobileViewport());
      }

      function initSidebar() {
        if (!appSidebar || !sidebarToggle || !appLayout) return;
        let collapsed = true;
        try {
          const stored = localStorage.getItem(SIDEBAR_STORAGE_KEY);
          if (stored === null) {
            collapsed = true;
            localStorage.setItem(SIDEBAR_STORAGE_KEY, '1');
          } else {
            collapsed = stored === '1';
          }
        } catch (_) {}

        applySidebarState(collapsed);

        sidebarToggle.addEventListener('click', () => {
          const next = !appLayout.classList.contains('sidebar-collapsed');
          applySidebarState(next);
        });
      }

      function closeProfileMenu() {
        if (profileMenu) profileMenu.style.display = 'none';
        if (profileTrigger) profileTrigger.setAttribute('aria-expanded', 'false');
        document.body.classList.remove('profile-menu-open');
      }

      function toggleProfileMenu() {
        if (!profileMenu || !profileTrigger) return;
        const isOpen = profileMenu.style.display === 'block';
        if (isOpen) {
          closeProfileMenu();
        } else {
          profileMenu.style.display = 'block';
          profileTrigger.setAttribute('aria-expanded', 'true');
          document.body.classList.add('profile-menu-open');
        }
      }

      initSidebar();

      if (sidebarBackdrop) {
        sidebarBackdrop.addEventListener('click', () => applySidebarState(true));
      }

      if (profileTrigger) {
        profileTrigger.addEventListener('click', (event) => {
          event.preventDefault();
          event.stopPropagation();
          toggleProfileMenu();
        });
      }

      if (profileMenu) {
        profileMenu.addEventListener('click', (event) => {
          event.stopPropagation();
        });
      }

      document.addEventListener('click', (event) => {
        if (!profileMenu || !profileTrigger) return;
        const target = event.target;
        if (profileTrigger.contains(target)) return;
        closeProfileMenu();
      });

      document.getElementById('account-overview-btn')?.addEventListener('click', () => {
        window.location.href = '/account.html';
      });
      document.getElementById('profile-settings-btn')?.addEventListener('click', () => {
        window.location.href = '/account.html';
      });
      document.getElementById('password-settings-btn')?.addEventListener('click', () => {
        window.location.href = '/account.html';
      });
      document.getElementById('manage-billing-btn')?.addEventListener('click', () => {
        window.location.href = '/account.html';
      });
      document.getElementById('sign-out-btn')?.addEventListener('click', () => {
        window.location.href = '/login.html';
      });
    </script>

    <script type="text/babel">
      const { useEffect, useMemo, useState } = React;

      function UploadZone({ disabled, onUploadComplete, userId }) {
        const [isUploading, setIsUploading] = useState(false);
        const [progress, setProgress] = useState(0);
        const [error, setError] = useState(null);
        const [dragActive, setDragActive] = useState(false);

        const uploadFile = (file) => {
          if (!file) return;

          if (file.size > 500 * 1024 * 1024) {
            setError('File too large. Max 500MB.');
            return;
          }

          if (!['video/mp4', 'video/quicktime', 'video/x-msvideo'].includes(file.type)) {
            setError('Invalid file type. Use MP4, MOV, or AVI.');
            return;
          }

          setError(null);
          setIsUploading(true);
          setProgress(0);

          const formData = new FormData();
          formData.append('video', file);
          formData.append('userId', userId);

          const xhr = new XMLHttpRequest();

          xhr.upload.addEventListener('progress', (e) => {
            if (e.lengthComputable) {
              setProgress(Math.round((e.loaded / e.total) * 100));
            }
          });

          xhr.addEventListener('load', () => {
            if (xhr.status === 200) {
              const data = JSON.parse(xhr.responseText);
              onUploadComplete(data.videoUrl, data.fileName);
            } else {
              let message = 'Upload failed';
              try {
                const payload = JSON.parse(xhr.responseText);
                if (payload?.error) message = payload.error;
              } catch (_e) {}
              setError(message);
            }
            setIsUploading(false);
          });

          xhr.addEventListener('error', () => {
            setError('Upload failed');
            setIsUploading(false);
          });

          xhr.open('POST', '/api/upload');
          xhr.send(formData);
        };

        const handleDrop = (e) => {
          e.preventDefault();
          if (disabled || isUploading) return;
          setDragActive(false);
          uploadFile(e.dataTransfer.files[0]);
        };

        const handleChange = (e) => {
          if (disabled || isUploading) return;
          uploadFile(e.target.files[0]);
        };

        return (
          <div>
            <div
              className={`upload-zone ${dragActive ? 'is-drag' : ''} ${disabled || isUploading ? 'is-disabled' : ''}`}
              onDrop={handleDrop}
              onDragOver={(e) => {
                e.preventDefault();
                if (disabled || isUploading) return;
                setDragActive(true);
              }}
              onDragLeave={() => setDragActive(false)}
              onClick={() => {
                if (disabled || isUploading) return;
                const input = document.getElementById('editor-file-input');
                if (input) input.click();
              }}
            >
              <input
                id="editor-file-input"
                type="file"
                accept="video/mp4,video/quicktime,video/x-msvideo"
                onChange={handleChange}
                style={{ display: 'none' }}
              />

              {isUploading ? (
                <div>
                  <p className="upload-title">Uploading...</p>
                  <div className="progress-track">
                    <div className="progress-fill" style={{ width: `${progress}%` }} />
                  </div>
                  <p className="upload-meta" style={{ marginTop: '10px' }}>{progress}%</p>
                </div>
              ) : (
                <div>
                  <div className="upload-icon">📤</div>
                  <p className="upload-title">Drop your video here</p>
                  <p className="upload-subtitle">or click to browse</p>
                  <p className="upload-meta">MP4, MOV, AVI • Max 500MB</p>
                </div>
              )}
            </div>
            {error ? <div style={{ marginTop: '10px' }} className="status-box error">{error}</div> : null}
          </div>
        );
      }

      function EditorCard({
        videoUrl,
        videoFileName,
        vibe,
        setVibe,
        onUploadComplete,
        onGenerate,
        generating,
        userId,
      }) {
        const step1Active = !videoUrl;
        const step2Active = Boolean(videoUrl);

        const quickVibes = useMemo(() => ([
          { label: 'Punchy TikTok', value: 'punchy TikTok with fast cuts and meme SFX' },
          { label: 'Cinematic Reels', value: 'smooth cinematic Instagram Reels' },
          { label: 'Comedy Chaos', value: 'chaotic comedy with zooms and shake effects' },
          { label: 'Smooth & Minimal', value: 'smooth and minimal aesthetic with subtle transitions' },
        ]), []);

        const canGenerate = Boolean(videoUrl && vibe.trim() && !generating);

        return (
          <section className="editor-card">
            <div>
              <div className="step-row">
                <span className={`step-circle ${step1Active ? 'is-active' : ''}`}>1</span>
                <h2 className="step-title">Upload Your Clip</h2>
              </div>
              <div className="step-content">
                <p className="step-help">Use a clear talking-head or storytelling clip for best results</p>
                {!videoUrl ? (
                  <UploadZone disabled={generating} onUploadComplete={onUploadComplete} userId={userId} />
                ) : (
                  <div className="status-box success">✓ Video uploaded: {videoFileName}</div>
                )}
              </div>
            </div>

            <div className="divider" />

            <div>
              <div className="step-row">
                <span className={`step-circle ${step2Active ? 'is-active' : ''}`}>2</span>
                <h2 className="step-title">Describe The Vibe</h2>
              </div>
              <div className="step-content">
                <textarea
                  className="vibe-textarea"
                  rows={3}
                  placeholder="e.g., punchy TikTok with fast cuts and meme SFX"
                  disabled={!videoUrl || generating}
                  value={vibe}
                  onChange={(e) => setVibe(e.target.value)}
                />

                <p className="quick-vibes-label">Quick vibes:</p>
                <div className="quick-vibes">
                  {quickVibes.map((item) => (
                    <button
                      key={item.label}
                      type="button"
                      className="quick-vibe-btn"
                      disabled={!videoUrl || generating}
                      onClick={() => setVibe(item.value)}
                    >
                      {item.label}
                    </button>
                  ))}
                </div>

                <button className="primary-btn secondary" disabled={!canGenerate} onClick={onGenerate}>
                  {generating ? 'Generating...' : 'Generate Edited Video'}
                </button>
              </div>
            </div>

            <div className="trust-badge">⚡ Powered by AI • Estimated time: 60-90 seconds</div>
          </section>
        );
      }

      function ProcessingState({ status, progress }) {
        return (
          <section className="state-card">
            <h2 className="state-title">Creating your video...</h2>
            <p className="state-muted">
              {status === 'queued' && 'Queued...'}
              {status === 'analyzing' && 'Analyzing clip...'}
              {status === 'editing' && 'Generating edit recipe...'}
              {status === 'rendering' && 'Rendering video...'}
            </p>
            <div className="progress-track">
              <div className="progress-fill" style={{ width: `${progress}%` }} />
            </div>
            <p className="state-muted" style={{ marginTop: '10px' }}>{progress}%</p>
          </section>
        );
      }

      function CompleteState({ renderedVideoUrl, onReset }) {
        return (
          <section className="state-card">
            <h2 className="state-title">Your video is ready</h2>
            <video src={renderedVideoUrl} controls className="video-preview" />
            <div className="state-actions">
              <a href={renderedVideoUrl} download className="secondary" style={{ textDecoration: 'none' }}>
                Download Video
              </a>
              <button className="ghost" onClick={onReset}>Edit Another Video</button>
            </div>
          </section>
        );
      }

      function ErrorState({ error, onReset }) {
        return (
          <section className="state-card">
            <h2 className="state-title">Something went wrong</h2>
            <p className="state-muted" style={{ marginBottom: '18px' }}>{error || 'Failed to process your video.'}</p>
            <button className="ghost" onClick={onReset}>Try Again</button>
          </section>
        );
      }

      function App() {
        const [userId] = useState(() => `user-${Math.random().toString(36).slice(2, 11)}`);
        const [videoUrl, setVideoUrl] = useState(null);
        const [videoFileName, setVideoFileName] = useState('');
        const [vibe, setVibe] = useState('');
        const [jobId, setJobId] = useState(null);
        const [status, setStatus] = useState('idle');
        const [progress, setProgress] = useState(0);
        const [renderedVideoUrl, setRenderedVideoUrl] = useState(null);
        const [error, setError] = useState(null);
        const [submitting, setSubmitting] = useState(false);

        useEffect(() => {
          if (!jobId) return undefined;

          const interval = setInterval(async () => {
            try {
              const response = await fetch(`/api/jobs/${jobId}`);
              if (!response.ok) return;
              const data = await response.json();

              setStatus(data.status || 'queued');
              setProgress(data.progress || 0);
              setRenderedVideoUrl(data.rendered_video_url || null);
              setError(data.error || null);

              if (data.status === 'complete' || data.status === 'error') {
                clearInterval(interval);
              }
            } catch (pollError) {
              console.error('Polling failed:', pollError);
            }
          }, 2000);

          return () => clearInterval(interval);
        }, [jobId]);

        const onUploadComplete = (url, fileName) => {
          setVideoUrl(url);
          setVideoFileName(fileName || 'video');
          setError(null);
        };

        const onGenerate = async () => {
          if (!videoUrl || !vibe.trim()) return;

          try {
            setSubmitting(true);
            setError(null);

            const response = await fetch('/api/generate', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ videoUrl, vibeInput: vibe.trim(), userId }),
            });

            const data = await response.json();
            if (!response.ok) {
              throw new Error(data?.error || 'Failed to create job');
            }

            setJobId(data.jobId);
            setStatus('queued');
            setProgress(0);
          } catch (generateError) {
            setError(generateError.message || 'Failed to create job');
          } finally {
            setSubmitting(false);
          }
        };

        const onReset = () => {
          setVideoUrl(null);
          setVideoFileName('');
          setVibe('');
          setJobId(null);
          setStatus('idle');
          setProgress(0);
          setRenderedVideoUrl(null);
          setError(null);
          setSubmitting(false);
        };

        const showWorkflow = !jobId;
        const showProcessing = jobId && status !== 'complete' && status !== 'error';
        const showComplete = status === 'complete' && renderedVideoUrl;
        const showError = status === 'error';

        return (
          <>
            {showWorkflow ? (
              <EditorCard
                videoUrl={videoUrl}
                videoFileName={videoFileName}
                vibe={vibe}
                setVibe={setVibe}
                onUploadComplete={onUploadComplete}
                onGenerate={onGenerate}
                generating={submitting}
                userId={userId}
              />
            ) : null}

            {showProcessing ? (
              <ProcessingState status={status} progress={progress} />
            ) : null}

            {showComplete ? (
              <CompleteState renderedVideoUrl={renderedVideoUrl} onReset={onReset} />
            ) : null}

            {showError ? (
              <ErrorState error={error} onReset={onReset} />
            ) : null}
          </>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('editor-react-root'));
      root.render(<App />);
    </script>
  </body>
</html>
