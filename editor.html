<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Video Editor | Promptly</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .page-editor {
      background: #0a0a0a;
      color: #f5f5f5;
      min-height: 100vh;
      margin: 0;
    }

    .editor-shell {
      max-width: 700px;
      margin: 0 auto;
      padding: 24px;
    }

    .editor-card {
      background: #1a1a1a;
      border: 1px solid #404040;
      border-radius: 16px;
      padding: 32px;
    }

    .editor-input,
    .editor-textarea {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      padding: 12px 14px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .editor-input:focus,
    .editor-textarea:focus {
      border-color: #7a7a7a;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.08);
    }

    .editor-btn-primary {
      width: 100%;
      background: #fff;
      color: #000;
      border: 1px solid #fff;
      border-radius: 10px;
      font-weight: 700;
      font-size: 16px;
      padding: 12px 16px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .editor-btn-primary:hover { background: #e8e8e8; }
    .editor-btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

    .editor-btn-ghost {
      background: transparent;
      color: #fff;
      border: 1px solid #666;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      padding: 11px 16px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    .editor-btn-ghost:hover {
      border-color: #fff;
      color: #fff;
      text-decoration: none;
    }

    .editor-dropzone {
      background: #151515;
      border: 2px dashed #606060;
      border-radius: 16px;
      padding: 48px 32px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .editor-dropzone.is-active {
      border-color: #a0a0a0;
      background: #1d1d1d;
    }

    .editor-dropzone.is-uploading {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .editor-progress-track {
      width: 100%;
      height: 10px;
      background: #2c2c2c;
      border-radius: 999px;
      overflow: hidden;
    }

    .editor-progress-fill {
      height: 100%;
      background: #fff;
      transition: width 0.25s ease;
    }

    .editor-pill {
      border: 1px solid #474747;
      background: #1c1c1c;
      color: #d0d0d0;
      border-radius: 999px;
      font-size: 12px;
      padding: 6px 10px;
      cursor: pointer;
    }

    .editor-pill:hover { border-color: #7a7a7a; color: #fff; }

    .editor-msg-success {
      background: #0f2318;
      border: 1px solid #2b7a4b;
      color: #b4f0c8;
      border-radius: 12px;
      padding: 12px 14px;
      font-weight: 600;
    }

    .editor-msg-error {
      background: #2a1111;
      border: 1px solid #7a2b2b;
      color: #ffb9b9;
      border-radius: 12px;
      padding: 12px 14px;
      font-weight: 600;
    }

    .editor-title {
      font-size: clamp(1.9rem, 4vw, 2.45rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0 0 8px;
    }

    .editor-subtitle {
      margin: 0;
      color: #808080;
      font-size: 15px;
      line-height: 1.5;
    }

    .editor-stage-title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .editor-stage-text {
      margin: 0;
      color: #808080;
      font-size: 14px;
    }

    .editor-main-wrap {
      min-height: 100vh;
    }

    @media (max-width: 768px) {
      .editor-shell { padding: 16px; }
      .editor-card { padding: 20px; }
      .editor-dropzone { padding: 36px 16px; }
    }
  </style>
</head>
<body class="page-editor">
  <div class="app-shell">
    <div class="app-layout sidebar-collapsed" id="app-layout">
      <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <span class="sidebar-toggle__bars" aria-hidden="true"></span>
      </button>
      <aside class="app-sidebar collapsed" id="app-sidebar">
        <div class="sidebar-fixed-inner">
          <nav class="sidebar-nav" aria-label="Workspace navigation">
            <a href="/calendar.html" class="sidebar-link">
              <span>Content Calendar</span>
            </a>
            <a href="/editor" class="sidebar-link is-active" aria-current="page">
              <span>AI Editor</span>
            </a>
            <a href="/library.html" class="sidebar-link">
              <span>Library</span>
            </a>
          </nav>
        </div>
      </aside>
      <div class="app-main editor-main-wrap">
        <div id="root"></div>
      </div>
    </div>
    <div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>
  </div>

  <script>
    (function initSidebar() {
      const appLayout = document.getElementById('app-layout');
      const appSidebar = document.getElementById('app-sidebar');
      const sidebarToggle = document.getElementById('sidebar-toggle');
      const sidebarBackdrop = document.getElementById('sidebar-backdrop');
      if (!appLayout || !appSidebar || !sidebarToggle || !sidebarBackdrop) return;

      function isMobile() {
        return window.matchMedia('(max-width: 960px)').matches;
      }

      function applySidebarState(collapsed) {
        appLayout.classList.toggle('sidebar-collapsed', collapsed);
        appSidebar.classList.toggle('collapsed', collapsed);
        sidebarToggle.setAttribute('aria-expanded', String(!collapsed));
        sidebarBackdrop.classList.toggle('visible', !collapsed && isMobile());
        document.body.classList.toggle('sidebar-open', !collapsed && isMobile());
      }

      sidebarToggle.addEventListener('click', () => {
        const collapsed = appSidebar.classList.contains('collapsed');
        applySidebarState(!collapsed);
      });

      sidebarBackdrop.addEventListener('click', () => applySidebarState(true));
      window.addEventListener('resize', () => {
        if (!isMobile()) {
          sidebarBackdrop.classList.remove('visible');
          document.body.classList.remove('sidebar-open');
        }
      });

      applySidebarState(isMobile());
    })();
  </script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function UploadZone({ onUploadComplete, userId }) {
      const [uploading, setUploading] = useState(false);
      const [progress, setProgress] = useState(0);
      const [error, setError] = useState(null);
      const [dragActive, setDragActive] = useState(false);

      const uploadFile = async (file) => {
        if (file.size > 500 * 1024 * 1024) {
          setError('File too large. Max 500MB.');
          return;
        }

        if (!['video/mp4', 'video/quicktime', 'video/x-msvideo'].includes(file.type)) {
          setError('Invalid file type. Use MP4, MOV, or AVI.');
          return;
        }

        setUploading(true);
        setError(null);
        setProgress(0);

        const formData = new FormData();
        formData.append('video', file);
        formData.append('userId', userId);

        const xhr = new XMLHttpRequest();

        xhr.upload.addEventListener('progress', (e) => {
          if (e.lengthComputable) {
            setProgress(Math.round((e.loaded / e.total) * 100));
          }
        });

        xhr.addEventListener('load', () => {
          if (xhr.status === 200) {
            const data = JSON.parse(xhr.responseText);
            onUploadComplete(data.videoUrl, data.fileName);
          } else {
            const data = (() => {
              try { return JSON.parse(xhr.responseText); } catch (_e) { return {}; }
            })();
            setError(data.error || 'Upload failed');
          }
          setUploading(false);
        });

        xhr.addEventListener('error', () => {
          setError('Upload failed');
          setUploading(false);
        });

        xhr.open('POST', '/api/upload');
        xhr.send(formData);
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setDragActive(false);
        const file = e.dataTransfer.files[0];
        if (file) uploadFile(file);
      };

      const handleChange = (e) => {
        const file = e.target.files[0];
        if (file) uploadFile(file);
      };

      return (
        <div className="w-full space-y-4">
          <div
            className={`editor-dropzone ${dragActive ? 'is-active' : ''} ${uploading ? 'is-uploading' : ''}`}
            onDrop={handleDrop}
            onDragOver={(e) => { e.preventDefault(); setDragActive(true); }}
            onDragLeave={() => setDragActive(false)}
            onClick={() => !uploading && document.getElementById('editorFileInput').click()}
          >
            <input
              id="editorFileInput"
              type="file"
              accept="video/mp4,video/quicktime,video/x-msvideo"
              onChange={handleChange}
              style={{ display: 'none' }}
            />

            {uploading ? (
              <div className="space-y-4">
                <p className="text-lg font-semibold text-white">Uploading...</p>
                <div className="editor-progress-track">
                  <div className="editor-progress-fill" style={{ width: `${progress}%` }} />
                </div>
                <p className="text-sm text-gray-300">{progress}%</p>
              </div>
            ) : (
              <div className="space-y-2">
                <div style={{ fontSize: '48px' }}>📤</div>
                <p style={{ fontSize: '18px' }} className="font-semibold text-white">Drop your video here</p>
                <p style={{ fontSize: '14px' }} className="text-gray-300">or click to browse</p>
                <p style={{ fontSize: '14px' }} className="text-gray-400 mt-3">MP4, MOV, AVI • Max 500MB</p>
              </div>
            )}
          </div>

          {error && <div className="editor-msg-error">❌ {error}</div>}
        </div>
      );
    }

    function VibeInput({ onSubmit, disabled }) {
      const [vibe, setVibe] = useState('');

      const suggestions = [
        'punchy TikTok with fast cuts and meme SFX',
        'smooth cinematic Instagram Reels',
        'chaotic comedy with zooms and shake effects',
      ];

      return (
        <div className="space-y-4">
          <div>
            <label className="block text-sm font-semibold text-gray-300 mb-2">
              Describe the vibe you want
            </label>
            <textarea
              value={vibe}
              onChange={(e) => setVibe(e.target.value)}
              placeholder="e.g., punchy TikTok with fast cuts and meme SFX"
              disabled={disabled}
              className="editor-textarea"
              rows={4}
            />
          </div>

          <div className="flex flex-wrap gap-2">
            {suggestions.map((s) => (
              <button
                key={s}
                type="button"
                onClick={() => setVibe(s)}
                disabled={disabled}
                className="editor-pill"
              >
                {s}
              </button>
            ))}
          </div>

          <button
            onClick={() => vibe.trim() && onSubmit(vibe.trim())}
            disabled={disabled || !vibe.trim()}
            className="editor-btn-primary"
          >
            Generate Edited Video
          </button>
        </div>
      );
    }

    function EditorPage() {
      const [userId] = useState(() => `user-${Math.random().toString(36).substr(2, 9)}`);
      const [videoUrl, setVideoUrl] = useState(null);
      const [videoFileName, setVideoFileName] = useState(null);
      const [jobId, setJobId] = useState(null);
      const [status, setStatus] = useState('idle');
      const [progress, setProgress] = useState(0);
      const [renderedVideoUrl, setRenderedVideoUrl] = useState(null);
      const [error, setError] = useState(null);

      useEffect(() => {
        if (!jobId) return;

        const interval = setInterval(async () => {
          try {
            const response = await fetch(`/api/jobs/${jobId}`);
            if (!response.ok) return;
            const data = await response.json();

            setStatus(data.status);
            setProgress(data.progress || 0);
            setRenderedVideoUrl(data.rendered_video_url || null);
            setError(data.error || null);

            if (data.status === 'complete' || data.status === 'error') {
              clearInterval(interval);
            }
          } catch (err) {
            console.error('Poll error:', err);
          }
        }, 2000);

        return () => clearInterval(interval);
      }, [jobId]);

      const handleUploadComplete = (url, fileName) => {
        setVideoUrl(url);
        setVideoFileName(fileName);
      };

      const handleVibeSubmit = async (vibe) => {
        try {
          const response = await fetch('/api/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ videoUrl, vibeInput: vibe, userId }),
          });

          const data = await response.json();
          if (!response.ok) throw new Error(data?.error || 'Failed to create job');
          setJobId(data.jobId);
          setStatus('queued');
          setProgress(0);
          setError(null);
        } catch (err) {
          setError(err.message || 'Failed to create job');
        }
      };

      return (
        <main className="editor-shell">
          <div style={{ marginBottom: '32px' }}>
            <h1 style={{ fontSize: '32px', fontWeight: '700', marginBottom: '8px', color: '#ffffff' }}>
              🎬 AI Video Editor
            </h1>
            <p className="editor-subtitle">
              Upload your clip, set the vibe, and let Promptly create your edited video
            </p>
          </div>

          {!videoUrl && (
            <section className="editor-card">
              <h3 className="editor-stage-title mb-2">Upload Your Clip</h3>
              <p className="editor-stage-text mb-5">Use a clear talking-head or storytelling clip for best results</p>
              <UploadZone onUploadComplete={handleUploadComplete} userId={userId} />
            </section>
          )}

          {videoUrl && !jobId && (
            <section className="editor-card space-y-4">
              <div className="editor-msg-success">✓ Video uploaded: {videoFileName}</div>
              <div>
                <h3 className="editor-stage-title mb-2">Set The Vibe</h3>
                <p className="editor-stage-text">Tell Promptly how you want the final edit to feel.</p>
              </div>
              <VibeInput onSubmit={handleVibeSubmit} />
            </section>
          )}

          {jobId && status !== 'complete' && status !== 'error' && (
            <section className="editor-card text-center space-y-4">
              <div style={{ fontSize: '48px' }}>🎬</div>
              <h3 className="editor-stage-title">Creating your video...</h3>
              <p className="editor-stage-text">
                {status === 'queued' && 'Queued...'}
                {status === 'analyzing' && 'Analyzing clip...'}
                {status === 'editing' && 'Generating edit recipe...'}
                {status === 'rendering' && 'Rendering video...'}
              </p>
              <div className="editor-progress-track">
                <div className="editor-progress-fill" style={{ width: `${progress}%` }} />
              </div>
              <p className="text-sm text-gray-300">{progress}%</p>
            </section>
          )}

          {status === 'complete' && renderedVideoUrl && (
            <section className="editor-card space-y-6 text-center">
              <h3 className="editor-stage-title">✨ Your video is ready!</h3>
              <video src={renderedVideoUrl} controls className="w-full max-w-md mx-auto rounded-xl border border-gray-700" />
              <div className="flex flex-wrap gap-3 justify-center">
                <a href={renderedVideoUrl} download className="editor-btn-primary" style={{ width: 'auto', paddingLeft: '20px', paddingRight: '20px' }}>
                  Download Video
                </a>
                <button onClick={() => window.location.reload()} className="editor-btn-ghost">
                  Edit Another Video
                </button>
              </div>
            </section>
          )}

          {status === 'error' && (
            <section className="editor-card">
              <div className="editor-msg-error">❌ Error: {error || 'Something went wrong while processing your video.'}</div>
              <div className="mt-4">
                <button onClick={() => window.location.reload()} className="editor-btn-ghost">Try Again</button>
              </div>
            </section>
          )}
        </main>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<EditorPage />);
  </script>
</body>
</html>
