<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Offline • Promptly</title>
<link rel="stylesheet" href="styles.css" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<link rel="stylesheet" href="/css/theme.css" />
<style>.offline-wrapper{min-height:70vh;display:grid;place-items:center;padding:2rem}.offline-card{max-width:560px;background:var(--surface);border:1px solid var(--card-border);border-radius:20px;padding:2rem;text-align:center}.offline-card h1{margin:0 0 .75rem;font-size:2.2rem;letter-spacing:-.02em}.offline-card p{margin:0 0 1.5rem;color:var(--text-secondary);line-height:1.6}</style>
<script src="https://t.contentsquare.net/uxa/9aea871ffd8c7.js"></script>
</head>
<body>
<div class="offline-wrapper">
  <div class="offline-card">
    <h1>You're Offline</h1>
    <p>The network is unavailable. Core assets are cached so you can retry shortly.</p>
    <p><button id="offline-retry" class="primary">Retry Connection</button></p>
  </div>
</div>
<footer class="footer">© 2025 Promptly.</footer>
<script>
  const retryButton = document.getElementById('offline-retry');
  if (retryButton) {
    retryButton.addEventListener('click', () => {
      location.reload();
    });
  }
</script>
</body>
</html>
