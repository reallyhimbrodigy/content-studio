services:
  - type: web
    name: promptly
    runtime: node
    branch: main
    rootDir: .
    buildCommand: npm install --omit=dev
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CANONICAL_HOST
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      # Stripe Billing
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_PRICE_LOOKUP_KEY
        sync: false
      - key: NODE_VERSION
        value: 20
    healthCheckPath: /healthz

crons:
  - name: trend-video-pipeline
    runtime: node
    schedule: "0 3 * * 0"
    buildCommand: npm install
    startCommand: node scripts/trend-video-pipeline.js
    envVars:
      - key: APIFY_API_TOKEN
        sync: false
      - key: GCS_BUCKET_NAME
        sync: false
      - key: GCS_CREDENTIALS_JSON
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
