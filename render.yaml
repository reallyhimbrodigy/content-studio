services:
  - type: web
    name: promptly
    runtime: node
    branch: main
    rootDir: .
    buildCommand: >-
      npm install --omit=dev &&
      mkdir -p /usr/share/fonts/truetype/montserrat &&
      curl -L -o /tmp/montserrat.zip "https://fonts.google.com/download?family=Montserrat" &&
      unzip -o /tmp/montserrat.zip -d /tmp/montserrat &&
      cp /tmp/montserrat/static/Montserrat-Black.ttf /usr/share/fonts/truetype/montserrat/ &&
      cp /tmp/montserrat/static/Montserrat-Bold.ttf /usr/share/fonts/truetype/montserrat/ &&
      cp /tmp/montserrat/static/Montserrat-ExtraBold.ttf /usr/share/fonts/truetype/montserrat/ &&
      fc-cache -fv &&
      rm -rf /tmp/montserrat /tmp/montserrat.zip
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CANONICAL_HOST
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      # Stripe Billing
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_PRICE_LOOKUP_KEY
        sync: false
      - key: NODE_VERSION
        value: 20
    healthCheckPath: /
