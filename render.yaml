services:
  - type: web
    name: promptly
    runtime: node
    branch: main
    rootDir: .
    buildCommand: npm install --omit=dev
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CANONICAL_HOST
        sync: false
      # NOTE: POSTHOG_API_KEY / POSTHOG_HOST are deliberately NOT declared here.
      # They were added manually in the dashboard first; declaring them in the
      # blueprint afterward made the blueprint sync try to claim ownership of
      # existing manual vars — "blueprint sync failed" (2026-07-20). Manual
      # dashboard vars + no blueprint declaration = no ownership conflict, ever.
      - key: PUBLIC_BASE_URL
        sync: false
      # Stripe Billing
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_PRICE_LOOKUP_KEY
        sync: false
      # AWS S3 (video storage colocated with Modal worker)
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: CLOUDFRONT_DOMAIN
        sync: false
      - key: NODE_VERSION
        value: 20
    healthCheckPath: /healthz

crons:
  - name: trend-video-pipeline
    runtime: node
    schedule: "0 3 * * 0"
    buildCommand: npm install
    startCommand: node scripts/trend-video-pipeline.js
    envVars:
      - key: APIFY_API_TOKEN
        sync: false
      - key: GCS_BUCKET_NAME
        sync: false
      - key: GCS_CREDENTIALS_JSON
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
  - name: daily-scoreboard
    runtime: node
    schedule: "0 15 * * *"
    buildCommand: npm install
    startCommand: node scripts/scoreboard.js
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
