<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - Promptly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="icon" type="image/svg+xml" href="assets/promptly-mark-white.png" />
  <link rel="mask-icon" href="assets/promptly-mark-white.png" color="#ffffff" />
  <link rel="apple-touch-icon" href="assets/promptly-mark-white.png" />
  <script src="https://t.contentsquare.net/uxa/9aea871ffd8c7.js"></script>
  <style>
    .rp-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .rp-card {
      width: 100%;
      max-width: 440px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 40px;
      background: var(--bg-surface);
    }

    .rp-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.8125rem;
      font-weight: 500;
      margin-bottom: 24px;
      transition: color 0.15s;
    }

    .rp-back:hover {
      color: var(--text-primary);
    }

    .rp-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-primary);
      margin: 0 0 6px;
    }

    .rp-subtitle {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin: 0 0 28px;
      line-height: 1.5;
    }

    .rp-field {
      margin-bottom: 16px;
    }

    .rp-label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .rp-input-wrap {
      position: relative;
    }

    .rp-input {
      width: 100%;
      height: 44px;
      padding: 0 44px 0 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--input-bg, var(--bg-body));
      color: var(--text-primary);
      font-size: 0.875rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
      box-sizing: border-box;
    }

    .rp-input:focus {
      border-color: var(--accent, #4f46e5);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .rp-input::placeholder {
      color: var(--text-tertiary);
    }

    .rp-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-tertiary);
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s;
    }

    .rp-toggle:hover {
      color: var(--text-primary);
    }

    .rp-hint {
      font-size: 0.75rem;
      color: var(--text-tertiary);
      margin: 6px 0 0;
    }

    /* Requirements checklist */
    .rp-requirements {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 20px 0 24px;
    }

    .rp-req {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8125rem;
      color: var(--text-tertiary);
      transition: color 0.2s;
    }

    .rp-req.met {
      color: #34d399;
    }

    .rp-req svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .rp-separator {
      height: 1px;
      background: var(--border-color);
      margin: 20px 0;
    }

    /* Confirm field — hidden until requirements met */
    .rp-confirm-section {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.3s ease, opacity 0.3s ease;
    }

    .rp-confirm-section.visible {
      max-height: 200px;
      opacity: 1;
    }

    .rp-submit {
      width: 100%;
      height: 44px;
      border-radius: 8px;
      border: none;
      background: var(--accent, #4f46e5);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      margin-top: 8px;
    }

    .rp-submit:hover {
      background: var(--accent-hover, #4338ca);
    }

    .rp-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .rp-feedback {
      text-align: center;
      font-size: 0.875rem;
      margin-top: 12px;
      min-height: 20px;
    }

    .rp-feedback.error {
      color: #f87171;
    }

    .rp-feedback.success {
      color: #34d399;
    }

    @media (max-width: 480px) {
      .rp-card {
        padding: 24px;
      }

      .rp-requirements {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="rp-page">
    <div class="rp-card">
      <a href="/" class="rp-back">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Back to home
      </a>

      <h1 class="rp-title">Reset Password</h1>
      <p class="rp-subtitle">Choose a strong password you haven't used before.</p>

      <form id="reset-password-form">
        <!-- New password -->
        <div class="rp-field">
          <label class="rp-label" for="new-password">New password</label>
          <div class="rp-input-wrap">
            <input class="rp-input" type="password" id="new-password" placeholder="Enter new password" required />
            <button type="button" class="rp-toggle" id="toggle-new" aria-label="Show password">
              <svg id="icon-eye-new" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="icon-eyeoff-new" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C5 20 1 12 1 12a21.77 21.77 0 0 1 5.06-6.06"/><path d="M9.88 9.88A3 3 0 0 0 14.12 14.12"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>

        <!-- Requirements checklist -->
        <div class="rp-requirements" id="rp-requirements">
          <div class="rp-req" id="req-lower">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="8" y1="8" x2="16" y2="16"/><line x1="16" y1="8" x2="8" y2="16"/></svg>
            <span>One lowercase letter</span>
          </div>
          <div class="rp-req" id="req-upper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="8" y1="8" x2="16" y2="16"/><line x1="16" y1="8" x2="8" y2="16"/></svg>
            <span>One uppercase letter</span>
          </div>
          <div class="rp-req" id="req-length">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="8" y1="8" x2="16" y2="16"/><line x1="16" y1="8" x2="8" y2="16"/></svg>
            <span>Minimum 8 characters</span>
          </div>
          <div class="rp-req" id="req-number">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="8" y1="8" x2="16" y2="16"/><line x1="16" y1="8" x2="8" y2="16"/></svg>
            <span>One number</span>
          </div>
        </div>

        <div class="rp-separator"></div>

        <!-- Confirm password — revealed when requirements met -->
        <div class="rp-confirm-section" id="confirm-section">
          <div class="rp-field">
            <label class="rp-label" for="confirm-password">Confirm new password</label>
            <div class="rp-input-wrap">
              <input class="rp-input" type="password" id="confirm-password" placeholder="Re-enter password" required />
              <button type="button" class="rp-toggle" id="toggle-confirm" aria-label="Show password">
                <svg id="icon-eye-confirm" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg id="icon-eyeoff-confirm" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C5 20 1 12 1 12a21.77 21.77 0 0 1 5.06-6.06"/><path d="M9.88 9.88A3 3 0 0 0 14.12 14.12"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
          </div>
        </div>

        <button type="submit" class="rp-submit" id="reset-btn" disabled>Reset password</button>
        <div class="rp-feedback" id="reset-feedback"></div>
      </form>
    </div>
  </div>

  <script type="module">
    import { supabase } from './supabase-client.js';

    const form = document.getElementById('reset-password-form');
    const newPw = document.getElementById('new-password');
    const confirmPw = document.getElementById('confirm-password');
    const resetBtn = document.getElementById('reset-btn');
    const feedback = document.getElementById('reset-feedback');
    const confirmSection = document.getElementById('confirm-section');

    // Check icons (used to replace X icons when requirement is met)
    const checkSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`;
    const xSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="8" y1="8" x2="16" y2="16"/><line x1="16" y1="8" x2="8" y2="16"/></svg>`;

    // Requirements
    const reqs = {
      lower: { el: document.getElementById('req-lower'), test: v => /[a-z]/.test(v) },
      upper: { el: document.getElementById('req-upper'), test: v => /[A-Z]/.test(v) },
      length: { el: document.getElementById('req-length'), test: v => v.length >= 8 },
      number: { el: document.getElementById('req-number'), test: v => /[0-9]/.test(v) },
    };

    function updateRequirements() {
      const pw = newPw.value;
      let allMet = true;
      for (const key in reqs) {
        const met = reqs[key].test(pw);
        const el = reqs[key].el;
        if (met) {
          el.classList.add('met');
          el.querySelector('svg').outerHTML = checkSvg;
        } else {
          el.classList.remove('met');
          el.querySelector('svg').outerHTML = xSvg;
          allMet = false;
        }
      }
      // Show confirm section when all requirements met
      if (allMet) {
        confirmSection.classList.add('visible');
      } else {
        confirmSection.classList.remove('visible');
        confirmPw.value = '';
      }
      updateSubmitState();
    }

    function updateSubmitState() {
      const pw = newPw.value;
      const cpw = confirmPw.value;
      const allMet = Object.values(reqs).every(r => r.test(pw));
      const matching = pw === cpw && cpw.length > 0;
      resetBtn.disabled = !(allMet && matching);
    }

    newPw.addEventListener('input', updateRequirements);
    confirmPw.addEventListener('input', updateSubmitState);

    // Toggle visibility
    function bindToggle(btnId, inputId, eyeId, eyeOffId) {
      const btn = document.getElementById(btnId);
      const input = document.getElementById(inputId);
      const eye = document.getElementById(eyeId);
      const eyeOff = document.getElementById(eyeOffId);
      if (!btn || !input) return;
      btn.addEventListener('click', () => {
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        eye.style.display = show ? 'none' : 'block';
        eyeOff.style.display = show ? 'block' : 'none';
        btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      });
    }

    bindToggle('toggle-new', 'new-password', 'icon-eye-new', 'icon-eyeoff-new');
    bindToggle('toggle-confirm', 'confirm-password', 'icon-eye-confirm', 'icon-eyeoff-confirm');

    // Form submit
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = newPw.value.trim();
      const cpw = confirmPw.value.trim();

      if (pw !== cpw) {
        feedback.textContent = 'Passwords do not match';
        feedback.className = 'rp-feedback error';
        return;
      }

      resetBtn.disabled = true;
      resetBtn.textContent = 'Resetting...';
      feedback.textContent = '';
      feedback.className = 'rp-feedback';

      try {
        const { error } = await supabase.auth.updateUser({ password: pw });
        if (error) throw error;

        feedback.textContent = 'Password reset successful! Redirecting...';
        feedback.className = 'rp-feedback success';
        resetBtn.textContent = 'Done!';
        setTimeout(() => { window.location.href = '/'; }, 2000);
      } catch (err) {
        console.error('Password reset error:', err);
        feedback.textContent = err.message || 'Failed to reset password. Please try again.';
        feedback.className = 'rp-feedback error';
        resetBtn.textContent = 'Reset password';
        resetBtn.disabled = false;
      }
    });

    // Check session validity
    (async () => {
      try {
        const { data: { session }, error } = await supabase.auth.getSession();
        if (error || !session) {
          feedback.textContent = 'Invalid or expired reset link. Please request a new password reset.';
          feedback.className = 'rp-feedback error';
          resetBtn.disabled = true;
        }
      } catch (err) {
        feedback.textContent = 'Unable to verify reset link. Please refresh the page.';
        feedback.className = 'rp-feedback error';
        resetBtn.disabled = true;
      }
    })();
  </script>
</body>
</html>
