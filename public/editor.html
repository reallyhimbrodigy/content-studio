    <style>
      body.auth-pending {
        visibility: hidden;
      }

      body.page-editor,
      body.page-editor .app-main,
      body.page-editor main.editor-main {
        background: #121212 !important;
      }

      .editor-main {
        width: 100%;
        max-width: 1000px;
        margin: 0 auto;
        padding: 40px 24px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .editor-topbar {
        display: flex;
        justify-content: flex-end;
        align-items: center;
      }

      .page-editor .user-tier-badge {
        background: #ffffff;
        color: #000000;
        border: 1px solid rgba(0, 0, 0, 0.15);
        font-weight: 700;
      }

      .editor-container {
        width: min(800px, 100%);
        margin: 0 auto;
      }

      .editor-hero {
        text-align: center;
        margin-bottom: 8px;
      }

      .editor-hero__title {
        margin: 0 0 8px;
        font-size: 32px;
        line-height: 1.1;
        letter-spacing: -0.01em;
        font-weight: 700;
        color: #ffffff;
      }

      .editor-hero__subtitle {
        margin: 0 auto 48px;
        max-width: 700px;
        font-size: 16px;
        font-weight: 400;
        color: #808080;
      }

      .editor-card {
        background: #1a1a1a;
        border: 1px solid #252525;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 0;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        transition: all 0.3s ease;
        position: relative;
      }

      .editor-card.is-drag {
        border-color: #ffffff;
        background: rgba(255, 255, 255, 0.02);
      }

      .attach-button {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        background: transparent;
        border: 1px solid #353535;
        color: #909090;
        font-size: 20px;
        font-weight: 300;
        line-height: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s ease;
        position: absolute;
        top: 16px;
        left: 16px;
      }

      .attach-button:hover {
        background: #1a1a1a;
        border-color: #353535;
        color: #ffffff;
      }

      .attach-button:focus,
      .attach-button:active {
        background: #222222;
        border-color: #404040;
        outline: none;
      }

      .composer-textarea {
        width: 100%;
        min-height: 120px;
        resize: none;
        background: transparent;
        border: none;
        color: #ffffff;
        font-size: 16px;
        line-height: 1.5;
        padding: 16px 16px 16px 60px;
      }

      .composer-textarea::placeholder {
        color: #606060;
      }

      .composer-textarea:focus {
        outline: none;
        box-shadow: none;
      }

      .upload-progress-wrap {
        margin-top: 16px;
      }

      .upload-progress-label {
        margin: 0 0 8px;
        font-size: 14px;
        color: #a0a0a0;
      }

      .attached-file {
        margin-top: 12px;
        background: #0f0f0f;
        border: 1px solid #252525;
        border-radius: 8px;
        padding: 10px 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        font-size: 14px;
      }

      .file-icon {
        font-size: 16px;
        color: #bcbcbc;
      }

      .file-name {
        color: #e0e0e0;
        font-weight: 500;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .file-size {
        color: #707070;
        font-size: 13px;
      }

      .remove-file {
        border: none;
        background: transparent;
        color: #707070;
        cursor: pointer;
        font-size: 18px;
        line-height: 1;
        padding: 0;
        width: 24px;
        height: 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
      }

      .remove-file:hover {
        background: #252525;
        color: #ffffff;
      }

      .example-hints {
        font-size: 13px;
        color: #606060;
        margin-top: 12px;
        text-align: left;
      }

      .composer-generate {
        width: 100%;
        height: 52px;
        margin-top: 16px;
        border: none;
        border-radius: 10px;
        background: #ffffff;
        color: #000000;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .composer-generate:hover:enabled {
        background: #f5f5f5;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
      }

      .composer-generate:disabled {
        background: transparent;
        color: #404040;
        border: 1px solid #252525;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .trust-badge {
        padding: 0;
        margin-top: 20px;
        font-size: 13px;
        color: #707070;
        text-align: center;
      }

      .state-card {
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 20px;
        padding: 60px;
        text-align: center;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        transition: all 0.3s ease;
      }

      .state-title {
        margin: 0 0 12px;
        font-size: 1.6rem;
      }

      .state-muted {
        color: #9a9a9a;
      }

      .progress-track {
        width: 100%;
        height: 8px;
        background: #2a2a2a;
        border-radius: 999px;
        overflow: hidden;
        margin-top: 24px;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #ffffff 0%, #e0e0e0 100%);
        transition: width 0.3s ease;
      }

      .state-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-top: 16px;
      }

      .video-preview {
        width: min(600px, 100%);
        border-radius: 16px;
        border: 1px solid #2a2a2a;
        margin: 0 auto;
        box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
      }

      @media (max-width: 980px) {
        .editor-main {
          padding: 24px 20px;
        }

        .editor-hero__title {
          font-size: 24px;
        }

        .editor-hero__subtitle {
          font-size: 15px;
          margin-bottom: 24px;
        }

        .editor-card,
        .state-card {
          padding: 24px;
          margin-bottom: 24px;
        }
      }

      body.page-editor .profile-menu-item.danger {
        background: #ef4444;
        color: #ffffff;
        border: none;
      }

      body.page-editor .profile-menu-item.danger:hover,
      body.page-editor .profile-menu-item.danger:focus,
      body.page-editor .profile-menu-item.danger:active,
      body.page-editor .profile-menu-item.danger:focus-visible {
        background: #dc2626;
        color: #ffffff;
      }

      body.page-editor .profile-menu-item.danger svg {
        color: #ffffff;
      }
    </style>

    <script type="module" src="footer.js?t=1771556488"></script>

    <script type="module">
      import { supabase } from './supabase-client.js?t=1771556488';

      try {
        window.supabaseClient = window.supabaseClient || supabase;
        const { data: { session }, error } = await supabase.auth.getSession();
        if (error || !session?.user) {
          window.location.replace('/auth.html');
          throw new Error('AUTH_REQUIRED');
        }
        document.body.classList.remove('auth-pending');
      } catch (error) {
        window.location.replace('/auth.html');
        throw error;
      }

      const SIDEBAR_STORAGE_KEY = 'promptly_sidebar_collapsed';
      const isMobileViewport = () => window.matchMedia('(max-width: 768px)').matches;

      const appLayout = document.getElementById('app-layout');
      const appSidebar = document.getElementById('app-sidebar');
      const sidebarToggle = document.getElementById('sidebar-toggle');
      const sidebarBackdrop = document.getElementById('sidebar-backdrop');

      const profileMenu = document.getElementById('profile-menu');
      const profileTrigger = document.getElementById('profile-trigger');

      function applySidebarState(collapsed) {
        if (!appSidebar || !appLayout || !sidebarToggle) return;
        appSidebar.classList.toggle('collapsed', collapsed);
        appLayout.classList.toggle('sidebar-collapsed', collapsed);
        sidebarToggle.setAttribute('aria-expanded', String(!collapsed));

        try {
          localStorage.setItem(SIDEBAR_STORAGE_KEY, collapsed ? '1' : '0');
        } catch (_) {}

        if (isMobileViewport()) {
          if (!collapsed) {
            document.documentElement.style.overflow = 'hidden';
            document.body.style.overflow = 'hidden';
          } else {
            document.documentElement.style.overflow = '';
            document.body.style.overflow = '';
          }
        } else {
          document.documentElement.style.overflow = '';
          document.body.style.overflow = '';
        }

        if (sidebarBackdrop) {
          sidebarBackdrop.classList.toggle('visible', !collapsed && isMobileViewport());
        }
        document.body.classList.toggle('sidebar-open', !collapsed && isMobileViewport());
      }

      function initSidebar() {
        if (!appSidebar || !sidebarToggle || !appLayout) return;
        let collapsed = true;
        try {
          const stored = localStorage.getItem(SIDEBAR_STORAGE_KEY);
          if (stored === null) {
            collapsed = true;
            localStorage.setItem(SIDEBAR_STORAGE_KEY, '1');
          } else {
            collapsed = stored === '1';
          }
        } catch (_) {}

        applySidebarState(collapsed);

        sidebarToggle.addEventListener('click', () => {
          const next = !appLayout.classList.contains('sidebar-collapsed');
          applySidebarState(next);
        });
      }

      function closeProfileMenu() {
        if (profileMenu) profileMenu.style.display = 'none';
        if (profileTrigger) profileTrigger.setAttribute('aria-expanded', 'false');
        document.body.classList.remove('profile-menu-open');
      }

      function toggleProfileMenu() {
        if (!profileMenu || !profileTrigger) return;
        const isOpen = profileMenu.style.display === 'block';
        if (isOpen) {
          closeProfileMenu();
        } else {
          profileMenu.style.display = 'block';
          profileTrigger.setAttribute('aria-expanded', 'true');
          document.body.classList.add('profile-menu-open');
        }
      }

      initSidebar();

      if (sidebarBackdrop) {
        sidebarBackdrop.addEventListener('click', () => applySidebarState(true));
      }

      if (profileTrigger) {
        profileTrigger.addEventListener('click', (event) => {
          event.preventDefault();
          event.stopPropagation();
          toggleProfileMenu();
        });
      }

      if (profileMenu) {
        profileMenu.addEventListener('click', (event) => {
          event.stopPropagation();
        });
      }

      document.addEventListener('click', (event) => {
        if (!profileMenu || !profileTrigger) return;
        const target = event.target;
        if (profileTrigger.contains(target)) return;
        closeProfileMenu();
      });

      const accountOverviewBtn = document.getElementById('account-overview-btn');
      const passwordSettingsBtn = document.getElementById('password-settings-btn');
      const manageBillingBtn = document.getElementById('manage-billing-btn');
      const signOutBtn = document.getElementById('sign-out-btn');
      const accountModal = document.getElementById('account-modal');
      const accountCloseBtn = document.getElementById('account-close-btn');
      const accountEmailDisplay = document.getElementById('account-email-display');
      const accountEmailCopyBtn = document.getElementById('account-email-copy');
      const accountPasswordManageBtn = document.getElementById('account-password-manage');
      const accountPlanStatusEl = document.getElementById('account-plan-status');

      async function resolveSupabaseAuthClient() {
        const existing = window?.supabaseClient || window?.supabase || null;
        if (existing?.auth?.getSession) return existing;
        try {
          const mod = await import('./supabase-client.js');
          if (mod?.supabase?.auth?.getSession) {
            window.supabaseClient = mod.supabase;
            return mod.supabase;
          }
        } catch (error) {
          console.warn('[AccountModal] failed to load supabase-client.js', error);
        }
        return null;
      }

      async function getSupabaseAccessToken() {
        const sb = await resolveSupabaseAuthClient();
        if (!sb?.auth?.getSession) return '';
        const { data, error } = await sb.auth.getSession();
        if (error) {
          console.warn('[AccountModal] getSession error', error);
          return '';
        }
        return data?.session?.access_token || '';
      }

      async function fetchWithAccountAuth(path, options = {}) {
        const token = await getSupabaseAccessToken();
        if (!token) {
          const err = new Error('auth_failed');
          err.status = 401;
          throw err;
        }
        const headers = new Headers(options.headers || {});
        if (options.body && !(options.body instanceof FormData) && !headers.has('Content-Type')) {
          headers.set('Content-Type', 'application/json');
        }
        headers.set('Authorization', `Bearer ${token}`);
        return fetch(path, {
          ...options,
          headers,
          credentials: 'include',
        });
      }

      async function loadAccountModalData() {
        console.log('=== LOADING ACCOUNT MODAL ===');
        try {
          console.log('Step 1: Resolving auth user...');
          const sb = await resolveSupabaseAuthClient();
          const { data: authData, error: authError } = sb?.auth?.getUser
            ? await sb.auth.getUser()
            : { data: { user: null }, error: new Error('supabase_client_missing') };
          const authUser = authData?.user || null;
          console.log('Auth user:', authUser?.email || 'No user', authError || null);

          if (accountEmailDisplay) {
            accountEmailDisplay.textContent = authUser?.email || 'Not signed in';
          }

          console.log('Step 2: Getting access token...');
          const token = await getSupabaseAccessToken();
          console.log('Access token present:', Boolean(token));

          console.log('Step 3: Fetching /api/profile/settings...');
          const response = await fetchWithAccountAuth('/api/profile/settings', { method: 'GET' });
          console.log('API response status:', response.status);
          const data = await response.json().catch(() => ({}));
          console.log('=== API RESPONSE ===');
          console.log('Full data:', JSON.stringify(data, null, 2));
          console.log('Subscription field:', data?.subscription);
          console.log('Plan field:', data?.plan);
          console.log('Tier field:', data?.tier);
          console.log('Status field:', data?.status);
          console.log('Is Pro?:', data?.isPro);
          console.log('===================');
          if (!response.ok) {
            console.log('API error body:', data);
            throw new Error(data?.error || 'profile_settings_fetch_failed');
          }

          let planTier = 'free';
          try {
            // Source-of-truth: Stripe-backed entitlements endpoint first.
            const entResp = await fetchWithAccountAuth('/api/entitlements', { method: 'GET' });
            const entData = await entResp.json().catch(() => ({}));
            console.log('[AccountModal] entitlements response:', entData);
            if (entResp.ok && entData && entData.tier) {
              const rawEntTier = String(entData.tier || 'free').toLowerCase();
              planTier = rawEntTier === 'paid' || rawEntTier === 'premium' ? 'pro' : rawEntTier;
            } else {
              const subResp = await fetchWithAccountAuth('/api/user/subscription', { method: 'GET' });
              const subData = await subResp.json().catch(() => ({}));
              console.log('[AccountModal] subscription fallback response:', subData);
              if (subResp.ok) {
                const rawTier = String(subData?.tier || subData?.plan || 'free').toLowerCase();
                planTier = rawTier === 'paid' || rawTier === 'premium' ? 'pro' : rawTier;
              }
            }
          } catch (tierError) {
            console.warn('[AccountModal] entitlement/subscription lookup failed', tierError);
          }

          if (accountPlanStatusEl) accountPlanStatusEl.textContent = planTier === 'pro' ? 'Promptly Pro' : 'Free';
          if (manageBillingBtn) manageBillingBtn.style.display = planTier === 'pro' ? 'inline-block' : 'none';
          console.log('Step 4: Account modal data loaded.');
        } catch (err) {
          console.error('=== LOAD FAILED ===', err);
          console.warn('Unable to load account modal data', err);
        }
      }

      async function openAccountModal() {
        if (!accountModal) return;
        accountModal.removeAttribute('hidden');
        accountModal.style.display = 'flex';
        accountModal.setAttribute('aria-hidden', 'false');
        document.body.classList.add('modal-open');
        closeProfileMenu();
        await loadAccountModalData();
      }

      function closeAccountModal() {
        if (!accountModal) return;
        accountModal.style.display = 'none';
        accountModal.setAttribute('hidden', '');
        accountModal.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('modal-open');
      }

      window.openAccountModal = openAccountModal;

      const bindProfileMenuAction = (btn, handler) => {
        if (!btn) return;
        const invoke = (event) => {
          if (event) {
            event.preventDefault();
            event.stopPropagation();
          }
          handler();
        };
        let pointerTriggered = false;
        btn.addEventListener('pointerdown', (event) => {
          if (event.button !== undefined && event.button !== 0) return;
          pointerTriggered = true;
          invoke(event);
        });
        btn.addEventListener('click', (event) => {
          if (pointerTriggered) {
            pointerTriggered = false;
            return;
          }
          invoke(event);
        });
        btn.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') invoke(event);
        });
      };

      bindProfileMenuAction(accountOverviewBtn, () => {
        closeProfileMenu();
        openAccountModal();
      });

      bindProfileMenuAction(passwordSettingsBtn, () => {
        closeProfileMenu();
        window.location.href = '/reset-password.html';
      });

      if (manageBillingBtn && !manageBillingBtn.dataset.bound) {
        manageBillingBtn.dataset.bound = '1';
        manageBillingBtn.addEventListener('click', async (e) => {
          e.preventDefault();
          let currentUser = '';
          try {
            const sb = await resolveSupabaseAuthClient();
            if (sb?.auth?.getUser) {
              const { data } = await sb.auth.getUser();
              currentUser = data?.user?.email || '';
            }
          } catch (_) {}
          if (!currentUser) {
            try {
              const profileResp = await fetchWithAccountAuth('/api/profile/settings', { method: 'GET' });
              const profileData = await profileResp.json().catch(() => ({}));
              const sb = await resolveSupabaseAuthClient();
              const { data } = sb?.auth?.getUser ? await sb.auth.getUser() : { data: { user: null } };
              currentUser = data?.user?.email || profileData?.email || '';
            } catch (_) {}
          }
          if (!currentUser) {
            try {
              currentUser = localStorage.getItem('promptly_last_user') || '';
            } catch (_) {}
          }
          if (!currentUser) {
            alert('Please sign in to manage billing.');
            return;
          }
          try {
            const resp = await fetch('/api/billing/portal', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${await getSupabaseAccessToken()}`
              },
              credentials: 'include',
              body: JSON.stringify({ returnUrl: window.location.href, email: currentUser })
            });
            const data = await resp.json().catch(() => ({}));
            if (resp.ok && data && data.url) {
              window.location.href = data.url;
            } else {
              alert(data?.error || 'Billing portal is not configured yet.');
            }
          } catch (_err) {
            alert('Billing portal unavailable. Please try again later.');
          }
        });
      }

      if (signOutBtn && !signOutBtn.dataset.bound) {
        signOutBtn.dataset.bound = '1';
        signOutBtn.addEventListener('click', async (e) => {
          e.preventDefault();
          e.stopPropagation();
          try {
            if (typeof window.storeSignOut === 'function') {
              await window.storeSignOut();
            } else {
              const sb = await resolveSupabaseAuthClient();
              if (sb?.auth?.signOut) await sb.auth.signOut();
            }
          } catch (err) {
            console.error('signOut error:', err);
          }
          window.location.replace('auth.html');
        });
      }

      if (accountCloseBtn) accountCloseBtn.addEventListener('click', closeAccountModal);
      if (accountModal) {
        accountModal.addEventListener('click', (event) => {
          if (event.target === accountModal) closeAccountModal();
        });
      }
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') closeAccountModal();
      });

      if (accountPasswordManageBtn) {
        accountPasswordManageBtn.addEventListener('click', () => {
          window.location.href = '/reset-password.html';
        });
      }

      if (accountEmailCopyBtn) {
        accountEmailCopyBtn.addEventListener('click', async () => {
          if (!accountEmailDisplay?.textContent) return;
          try {
            await navigator.clipboard.writeText(accountEmailDisplay.textContent);
          } catch (_) {}
        });
      }

      loadAccountModalData();
    </script>

    <script type="module">
      (function initEditorPage() {
        const root = document.getElementById('editor-react-root');
        if (!root) return;

        const state = {
          userId: '',
          videoUrl: null,
          videoFileName: '',
          videoFileSize: 0,
          vibe: '',
          jobId: null,
          status: 'idle',
          progress: 0,
          currentStep: '',
          renderedVideoUrl: null,
          error: null,
          isUploading: false,
          uploadProgress: 0,
          submitting: false,
        };
        let pollInterval = null;

        root.innerHTML = `
          <header class="editor-hero">
            <h1 class="editor-hero__title">AI Video Editor</h1>
            <p class="editor-hero__subtitle">Turn raw clips into viral videos</p>
          </header>

          <section id="upload-section" class="editor-card">
            <div id="input-box">
              <button id="attach-btn" type="button" class="attach-button" aria-label="Attach video">+</button>
              <textarea id="vibe-textarea" class="composer-textarea" rows="8" placeholder="What vibe are you going for?"></textarea>
              <div class="example-hints">Try: "Punchy TikTok" • "Smooth Reels" • "Chaotic Comedy"</div>

              <div id="upload-progress-wrap" class="upload-progress-wrap" style="display:none;">
                <p id="upload-progress-label" class="upload-progress-label">Uploading... 0%</p>
                <div class="progress-track"><div id="upload-progress-fill" class="progress-fill" style="width:0%;"></div></div>
              </div>

              <div id="attached-file" class="attached-file" style="display:none;">
                <span class="file-icon">📎</span>
                <span id="file-name" class="file-name"></span>
                <span id="file-size" class="file-size"></span>
                <button id="remove-file" type="button" class="remove-file" aria-label="Remove file">×</button>
              </div>

              <div id="composer-error" style="display:none; margin-top:12px; color:#f87171; font-size:14px;"></div>
              <button id="generate-btn" class="composer-generate" type="button" disabled>Generate Edited Video</button>
            </div>
          </section>

          <section id="processing-section" class="state-card" style="display:none;">
            <h2 class="state-title">Creating your video...</h2>
            <p id="status-text" class="state-muted">Queued...</p>
            <div class="progress-track"><div id="progress-fill" class="progress-fill" style="width:0%;"></div></div>
            <p id="progress-text" class="state-muted" style="margin-top:10px;">0%</p>
          </section>

          <section id="complete-section" class="state-card" style="display:none;">
            <h2 class="state-title">Your video is ready</h2>
            <video id="video-preview" controls class="video-preview"></video>
            <div class="state-actions">
              <a id="download-link" href="#" download class="secondary" style="text-decoration:none;">Download Video</a>
              <button id="edit-another-btn" class="ghost" type="button">Edit Another Video</button>
            </div>
          </section>

          <section id="error-section" class="state-card" style="display:none;">
            <h2 class="state-title">Something went wrong</h2>
            <p id="error-text" class="state-muted" style="margin-bottom:18px;">Failed to process your video.</p>
            <button id="retry-btn" class="ghost" type="button">Try Again</button>
          </section>

          <div id="trust-badge" class="trust-badge">Estimated time: 60-90 seconds</div>
        `;

        const fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = 'video/mp4,video/quicktime,video/x-msvideo';
        fileInput.style.display = 'none';
        document.body.appendChild(fileInput);

        const uploadSection = document.getElementById('upload-section');
        const inputBox = document.getElementById('input-box');
        const attachBtn = document.getElementById('attach-btn');
        const vibeTextarea = document.getElementById('vibe-textarea');
        const generateBtn = document.getElementById('generate-btn');
        const uploadProgressWrap = document.getElementById('upload-progress-wrap');
        const uploadProgressLabel = document.getElementById('upload-progress-label');
        const uploadProgressFill = document.getElementById('upload-progress-fill');
        const attachedFile = document.getElementById('attached-file');
        const fileNameEl = document.getElementById('file-name');
        const fileSizeEl = document.getElementById('file-size');
        const removeFileBtn = document.getElementById('remove-file');
        const composerError = document.getElementById('composer-error');
        const processingSection = document.getElementById('processing-section');
        const statusText = document.getElementById('status-text');
        const progressFill = document.getElementById('progress-fill');
        const progressText = document.getElementById('progress-text');
        const completeSection = document.getElementById('complete-section');
        const videoPreview = document.getElementById('video-preview');
        const downloadLink = document.getElementById('download-link');
        const editAnotherBtn = document.getElementById('edit-another-btn');
        const errorSection = document.getElementById('error-section');
        const errorText = document.getElementById('error-text');
        const retryBtn = document.getElementById('retry-btn');
        const trustBadge = document.getElementById('trust-badge');

        const formatFileSize = (bytes) => {
          const value = Number(bytes || 0);
          if (!Number.isFinite(value) || value <= 0) return '';
          return `${(value / (1024 * 1024)).toFixed(1)} MB`;
        };

        const syncGenerateState = () => {
          const canGenerate = Boolean(state.videoUrl && state.vibe.trim() && !state.submitting && !state.isUploading);
          generateBtn.disabled = !canGenerate;
        };

        const render = () => {
          const showWorkflow = !state.jobId;
          const showProcessing = state.jobId && !['complete', 'completed', 'error', 'failed'].includes(state.status);
          const showComplete = ['complete', 'completed'].includes(state.status) && state.renderedVideoUrl;
          const showError = ['error', 'failed'].includes(state.status);

          uploadSection.style.display = showWorkflow ? 'block' : 'none';
          processingSection.style.display = showProcessing ? 'block' : 'none';
          completeSection.style.display = showComplete ? 'block' : 'none';
          errorSection.style.display = showError ? 'block' : 'none';
          trustBadge.style.display = showWorkflow ? 'block' : 'none';

          vibeTextarea.value = state.vibe;
          vibeTextarea.disabled = state.submitting || state.isUploading;
          attachBtn.disabled = state.submitting || state.isUploading;

          attachedFile.style.display = state.videoUrl ? 'flex' : 'none';
          fileNameEl.textContent = state.videoFileName || '';
          fileSizeEl.textContent = state.videoFileSize ? formatFileSize(state.videoFileSize) : '';

          uploadProgressWrap.style.display = state.isUploading ? 'block' : 'none';
          uploadProgressLabel.textContent = `Uploading... ${state.uploadProgress}%`;
          uploadProgressFill.style.width = `${state.uploadProgress}%`;

          composerError.style.display = state.error && showWorkflow ? 'block' : 'none';
          composerError.textContent = state.error || '';

          if (showProcessing) {
              const label = state.currentStep || (state.status === 'queued'
              ? 'Queued...'
              : state.status === 'analyzing'
                ? 'Analyzing clip...'
                : state.status === 'editing'
                  ? 'Generating edit recipe...'
                  : state.status === 'rendering'
                    ? 'Rendering video...'
                    : 'Processing...');
              statusText.textContent = label;
            progressFill.style.width = `${state.progress || 0}%`;
            progressText.textContent = `${state.progress || 0}%`;
          }

          if (showComplete) {
            videoPreview.src = state.renderedVideoUrl;
            downloadLink.href = state.renderedVideoUrl;
          }

          if (showError) {
            errorText.textContent = state.error || 'Failed to process your video.';
          }

          syncGenerateState();
        };

        const reset = () => {
          if (pollInterval) {
            clearInterval(pollInterval);
            pollInterval = null;
          }
          state.videoUrl = null;
          state.videoFileName = '';
          state.videoFileSize = 0;
          state.vibe = '';
          state.jobId = null;
          state.status = 'idle';
          state.progress = 0;
          state.currentStep = '';
          state.renderedVideoUrl = null;
          state.error = null;
          state.isUploading = false;
          state.uploadProgress = 0;
          state.submitting = false;
          render();
        };

        const getSupabaseClient = () => window.supabaseClient || window.supabase || null;

        const getAuthContext = async () => {
          const sb = getSupabaseClient();
          if (!sb?.auth?.getSession || !sb?.auth?.getUser) {
            throw new Error('Authentication client unavailable');
          }
          const [{ data: sessionData, error: sessionError }, { data: userData, error: userError }] = await Promise.all([
            sb.auth.getSession(),
            sb.auth.getUser(),
          ]);
          if (sessionError || userError || !sessionData?.session?.access_token || !userData?.user?.id) {
            throw new Error('Please sign in to continue');
          }
          state.userId = userData.user.id;
          return {
            token: sessionData.session.access_token,
            user: userData.user,
          };
        };

        const uploadFile = async (file) => {
          if (!file) return;
          if (file.size > 500 * 1024 * 1024) {
            state.error = 'File too large. Max 500MB.';
            render();
            return;
          }
          if (!['video/mp4', 'video/quicktime', 'video/x-msvideo'].includes(file.type)) {
            state.error = 'Invalid file type. Use MP4, MOV, or AVI.';
            render();
            return;
          }

          state.error = null;
          state.isUploading = true;
          state.uploadProgress = 0;
          render();

          let authContext = null;
          try {
            authContext = await getAuthContext();
          } catch (authError) {
            state.isUploading = false;
            state.error = authError?.message || 'Please sign in to upload videos.';
            render();
            return;
          }

          const formData = new FormData();
          formData.append('video', file);
          formData.append('userId', authContext.user.id);

          const xhr = new XMLHttpRequest();
          xhr.upload.addEventListener('progress', (e) => {
            if (e.lengthComputable) {
              state.uploadProgress = Math.round((e.loaded / e.total) * 100);
              render();
            }
          });
          xhr.addEventListener('load', () => {
            state.isUploading = false;
            if (xhr.status === 200) {
              const data = JSON.parse(xhr.responseText);
              state.videoUrl = data.videoUrl;
              state.videoFileName = data.fileName || file.name || 'video';
              state.videoFileSize = file.size || 0;
              state.error = null;
            } else {
              let message = 'Upload failed';
              try {
                const payload = JSON.parse(xhr.responseText);
                if (payload?.error) message = payload.error;
              } catch (_) {}
              state.error = message;
            }
            render();
          });
          xhr.addEventListener('error', () => {
            state.isUploading = false;
            state.error = 'Upload failed';
            render();
          });
          xhr.open('POST', '/api/upload');
          xhr.setRequestHeader('Authorization', `Bearer ${authContext.token}`);
          xhr.send(formData);
        };

        const startPolling = (jobId) => {
          console.log('🔄 Starting polling for job:', jobId);
          
          if (pollInterval) {
            console.log('  Clearing existing poll interval');
            clearInterval(pollInterval);
          }
          
          let pollCount = 0;
          let consecutiveErrors = 0;
          const MAX_POLL_DURATION_MS = 10 * 60 * 1000; // 10 minutes max
          const pollStartTime = Date.now();
          
          const doPoll = async () => {
            pollCount++;
            const elapsed = Date.now() - pollStartTime;
            
            // Safety: stop polling after 10 minutes
            if (elapsed > MAX_POLL_DURATION_MS) {
              console.error('⏰ Polling timeout after 10 minutes');
              clearInterval(pollInterval);
              pollInterval = null;
              state.status = 'error';
              state.error = 'Job timed out. Please check your library or try again.';
              render();
              return;
            }
            
            try {
              const auth = await getAuthContext();
              // Cache-bust to avoid any intermediate caching
              const url = `/api/video-jobs/${jobId}?_t=${Date.now()}`;
              
              const response = await fetch(url, {
                headers: {
                  Authorization: `Bearer ${auth.token}`,
                  'Cache-Control': 'no-cache',
                },
              });
              
              if (!response.ok) {
                consecutiveErrors++;
                console.error(`❌ Poll ${pollCount} failed (${consecutiveErrors} consecutive): status ${response.status}`);
                // After 5 consecutive failures, show error
                if (consecutiveErrors >= 5) {
                  clearInterval(pollInterval);
                  pollInterval = null;
                  state.status = 'error';
                  state.error = 'Lost connection to server. Please refresh the page.';
                  render();
                }
                return;
              }
              
              consecutiveErrors = 0; // Reset on success
              
              const data = await response.json();
              console.log(`📡 Poll ${pollCount}: status=${data.status}, progress=${data.progress}%, step=${data.current_step}`);
              
              state.status = data.status || 'queued';
              state.progress = data.progress || 0;
              state.currentStep = data.current_step || '';
              state.renderedVideoUrl = data.result_url || data.rendered_video_url || null;
              state.error = data.error_message || data.error || null;
              render();
              
              if (['complete', 'completed', 'error', 'failed'].includes(data.status)) {
                console.log(`✅ Job finished with status: ${data.status}`);
                clearInterval(pollInterval);
                pollInterval = null;
              }
            } catch (err) {
              consecutiveErrors++;
              console.error(`❌ Poll ${pollCount} error (${consecutiveErrors} consecutive):`, err.message);
              if (consecutiveErrors >= 5) {
                clearInterval(pollInterval);
                pollInterval = null;
                state.status = 'error';
                state.error = 'Lost connection to server. Please refresh the page.';
                render();
              }
            }
          };
          
          // Do first poll immediately instead of waiting 2s
          doPoll();
          pollInterval = setInterval(doPoll, 2000);
        };

        const handleGenerate = async () => {
          console.log('🎬 GENERATE BUTTON CLICKED');
          
          if (!state.videoUrl || !state.vibe.trim()) {
            console.log('❌ Missing video URL or vibe');
            console.log('  Video URL:', state.videoUrl);
            console.log('  Vibe:', state.vibe);
            return;
          }
          
          state.submitting = true;
          state.error = null;
          render();
          
          try {
            console.log('Step 1: Getting auth context...');
            const auth = await getAuthContext();
            console.log('  User ID:', auth.user?.id);
            console.log('  Token exists:', !!auth.token);
            
            console.log('Step 2: Preparing request...');
            const payload = {
              video_url: state.videoUrl,
              vibe_input: state.vibe.trim(),
              user_id: auth.user.id,
            };
            console.log('  Payload:', payload);
            console.log('  URL: /api/video-jobs');
            console.log('  Method: POST');
            
            console.log('Step 3: Making fetch request...');
            const response = await fetch('/api/video-jobs', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${auth.token}`,
              },
              body: JSON.stringify(payload),
            });
            
            console.log('Step 4: Response received');
            console.log('  Status:', response.status);
            console.log('  Status Text:', response.statusText);
            console.log('  OK:', response.ok);
            console.log('  URL:', response.url);
            
            const data = await response.json();
            console.log('  Response data:', data);
            
            if (!response.ok) {
              console.error('❌ Response not OK');
              throw new Error(data?.error || 'Failed to create job');
            }
            
            console.log('✅ Job created successfully');
            console.log('  Job ID:', data.job_id || data.jobId);
            
            state.jobId = data.job_id || data.jobId;
            state.status = 'queued';
            state.progress = 0;
            state.currentStep = 'Queued';
            state.error = null;
            startPolling(state.jobId);
            
          } catch (err) {
            console.error('❌ ERROR in handleGenerate:');
            console.error('  Message:', err.message);
            console.error('  Stack:', err.stack);
            console.error('  Full error:', err);
            state.error = err?.message || 'Failed to create job';
          } finally {
            state.submitting = false;
            render();
          }
        };

        attachBtn.addEventListener('click', () => {
          if (state.submitting || state.isUploading) return;
          fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
          const file = e.target.files?.[0];
          if (file) uploadFile(file);
          e.target.value = '';
        });

        inputBox.addEventListener('dragover', (e) => {
          e.preventDefault();
          if (state.submitting || state.isUploading) return;
          uploadSection.classList.add('is-drag');
        });
        inputBox.addEventListener('dragleave', () => {
          uploadSection.classList.remove('is-drag');
        });
        inputBox.addEventListener('drop', (e) => {
          e.preventDefault();
          uploadSection.classList.remove('is-drag');
          if (state.submitting || state.isUploading) return;
          const file = e.dataTransfer.files?.[0];
          if (file) uploadFile(file);
        });

        vibeTextarea.addEventListener('input', (e) => {
          state.vibe = e.target.value || '';
          syncGenerateState();
        });

        removeFileBtn.addEventListener('click', () => {
          state.videoUrl = null;
          state.videoFileName = '';
          state.videoFileSize = 0;
          render();
        });

        generateBtn.addEventListener('click', handleGenerate);
        editAnotherBtn.addEventListener('click', reset);
        retryBtn.addEventListener('click', reset);

        render();
      })();
    </script>
  </body>
